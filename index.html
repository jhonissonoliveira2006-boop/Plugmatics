<script>
/* termos destacados: toque em um nome em negrito com destaque azul para abrir um resumo só dele */
(()=>{const G={"Durkheim": ["Émile Durkheim", "Fundador da Sociologia como ciência. Defendia que a sociedade é mais que a soma das pessoas: ela tem regras próprias que moldam o que fazemos.", "Exemplo: você fala português porque nasceu num grupo que já falava, e não porque escolheu."], "fato social": ["Fato social", "Maneira de agir, pensar ou sentir que existe fora de cada pessoa (externo), vale para todo o grupo (geral) e pressiona quem foge dela (coercitivo).", "Exemplo: usar roupa na rua. Ninguém te obriga com uma lei, mas quem não usa sofre reprovação."], "anomia": ["Anomia", "Situação em que as normas sociais enfraquecem ou deixam de orientar as pessoas, e a sociedade fica desorganizada.", "Exemplo: uma crise tão grande que ninguém mais sabe quais regras valem."], "Weber": ["Max Weber", "Sociólogo que quis entender as pessoas por dentro: o sentido que elas dão às suas ações. Também estudou como a vida moderna ficou mais calculada e organizada.", "Exemplo: duas pessoas vão à igreja, uma por fé e outra por tradição. A ação é igual, o sentido é outro."], "ação social": ["Ação social", "Ação que a pessoa faz levando em conta o outro e dando a ela um sentido.", "Exemplo: levantar a mão para cumprimentar um vizinho é ação social; espirrar não é."], "racionalização": ["Racionalização", "Processo da vida moderna em que tudo passa a ser planejado, medido e feito pelo meio mais eficiente, com menos espaço para tradição e emoção.", "Exemplo: empresas que medem o tempo de cada tarefa."], "burocracia": ["Burocracia", "Forma de organização com regras escritas, hierarquia e funções definidas. Para Weber, é eficiente, mas pode deixar as relações frias e lentas.", "Exemplo: pedir um documento e passar por vários guichês e formulários."], "Marx": ["Karl Marx", "Pensador que explicou a sociedade pela economia: quem controla os meios de produção tem poder sobre quem trabalha.", "Exemplo: o dono da fábrica e o operário têm interesses diferentes."], "luta de classes": ["Luta de classes", "Conflito entre quem possui os meios de produção (burguesia) e quem vive de vender o seu trabalho (proletariado). Para Marx, é o motor da história.", "Exemplo: greve por salário melhor."], "mais-valia": ["Mais-valia", "Diferença entre o valor que o trabalhador produz e o salário que recebe. Essa sobra fica com o dono e vira lucro.", "Exemplo: o operário produz R$ 300 por dia e recebe R$ 100."], "alienação": ["Alienação", "Quando o trabalhador não controla o que produz nem se reconhece no próprio trabalho, como se ele fosse de outra pessoa.", "Exemplo: apertar o mesmo parafuso o dia todo sem ver o produto pronto."], "etnocentrismo": ["Etnocentrismo", "Julgar outras culturas usando a própria como medida, achando a sua melhor ou mais certa.", "Exemplo: chamar o costume de outro povo de «estranho» ou «atrasado»."], "relativismo cultural": ["Relativismo cultural", "Entender cada prática dentro do contexto e dos valores da cultura em que ela acontece, sem julgar pela sua.", "Exemplo: comer com as mãos pode ser normal em um país e rude em outro."], "indústria cultural": ["Indústria cultural", "Termo de Adorno e Horkheimer: a cultura passa a ser produzida em série como mercadoria, feita para vender e distrair mais que para fazer pensar.", "Exemplo: músicas e séries criadas por fórmula para agradar o maior público."], "hibridismo": ["Hibridismo cultural", "Mistura de elementos de culturas diferentes que gera algo novo.", "Exemplo: o funk carioca mistura ritmos americanos, africanos e brasileiros."], "mobilidade social": ["Mobilidade social", "Mudança de posição na escala social, para cima ou para baixo, por exemplo ao mudar de classe ou profissão.", "Exemplo: filho de operário que vira médico."], "capital cultural": ["Capital cultural", "Termo de Bourdieu: conhecimentos, gostos, hábitos e diplomas que ajudam a se dar bem na vida e que passam de família para filhos.", "Exemplo: crescer em casa com livros facilita a escola."], "Sérgio Buarque": ["Sérgio Buarque de Holanda", "Historiador de «Raízes do Brasil». Disse que o brasileiro é «cordial»: age mais pela emoção e pela relação pessoal do que por regras impessoais.", "Exemplo: pedir um favor a um conhecido para driblar a fila."], "Darcy Ribeiro": ["Darcy Ribeiro", "Antropólogo de «O povo brasileiro». Defendeu que nosso povo nasceu da mistura entre indígenas, africanos e europeus.", "Exemplo: a culinária brasileira reúne as três heranças."], "Arché": ["Arché", "Palavra grega para «princípio»: aquilo de que tudo é feito e de onde tudo vem. A primeira pergunta da filosofia foi «do que o mundo é feito?».", "Exemplo: para Tales, a resposta foi a água."], "Mileto": ["Escola de Mileto", "Cidade grega onde nasceu a filosofia. Tales, Anaximandro e Anaxímenes procuraram explicar a natureza pela razão, e não pelos mitos.", "Exemplo: em vez de «Poseidon causa o terremoto», Tales falou da água."], "ápeiron": ["Ápeiron", "Termo de Anaximandro para o princípio de tudo: algo infinito, sem limite e sem forma, de onde as coisas saem e para onde voltam.", "Exemplo: pense numa massa sem forma da qual se moldam todas as coisas."], "Heráclito": ["Heráclito", "Disse que tudo muda o tempo todo, como um rio que nunca é o mesmo. Para ele, o fogo representa essa mudança.", "Frase famosa: não se entra duas vezes no mesmo rio."], "Pitágoras": ["Pitágoras", "Para ele, o mundo segue relações numéricas. Descobriu que a música também obedece a proporções entre números.", "Exemplo: uma corda com metade do tamanho soa uma oitava acima."], "Empédocles": ["Empédocles", "Juntou as ideias anteriores: tudo é feito de quatro elementos (terra, água, ar e fogo) que se unem pelo Amor e se separam pela Discórdia.", "Exemplo: madeira queimando mostra terra, ar e fogo se separando."], "Demócrito": ["Demócrito", "Defendeu que tudo é feito de átomos, partículas indivisíveis que se movem no vazio. As coisas mudam porque os átomos se juntam e se separam.", "Exemplo: uma areia vista de perto, feita de grãos minúsculos."], "tábula rasa": ["Tábula rasa", "Expressão de Locke: a mente nasce como uma folha em branco e é preenchida pela experiência.", "Exemplo: ninguém nasce sabendo uma língua; aprende ao ouvir."], "imperativo categórico": ["Imperativo categórico", "Regra ética de Kant: aja só de um modo que você aceitaria que fosse lei para todos, e trate as pessoas como fim, nunca só como meio.", "Exemplo: mentir não passa no teste, porque se todos mentissem, ninguém confiaria em ninguém."],"quinhentismo": ["Quinhentismo", "Primeira fase da literatura no Brasil (séc. XVI). São textos de portugueses que chegaram aqui: cartas e relatos sobre a terra e escritos para catequizar indígenas.", "Exemplo: a Carta de Pero Vaz de Caminha ao rei."], "barroco": ["Barroco", "Estilo do séc. XVII marcado por contrastes e conflito: fé contra razão, céu contra terra, prazer contra culpa. Usa linguagem rebuscada.", "Exemplo: poemas de Gregório de Matos, o «Boca do Inferno»."], "arcadismo": ["Arcadismo", "Estilo do séc. XVIII que volta à simplicidade: vida no campo, pastores, natureza calma e linguagem equilibrada, como reação ao exagero barroco.", "Exemplo: poeta que se disfarça de pastor e fala da amada «Marília»."], "romantismo": ["Romantismo", "Estilo do séc. XIX que valoriza a emoção, o amor idealizado, a natureza e o orgulho nacional. No Brasil, criou heróis como o indígena.", "Exemplo: «Iracema», de José de Alencar."], "realismo": ["Realismo", "Estilo da segunda metade do séc. XIX que mostra a sociedade como ela é, com olhar objetivo e crítico, sem idealizar.", "Exemplo: Machado de Assis critica a hipocrisia da elite em «Dom Casmurro»."], "naturalismo": ["Naturalismo", "Parente do Realismo, com ideia científica: o ser humano é moldado pelo meio, pela hereditariedade e pelos instintos. Mostra o lado mais cru da vida.", "Exemplo: em «O Cortiço», o ambiente do cortiço molda o comportamento dos moradores."], "parnasianismo": ["Parnasianismo", "Poesia do fim do séc. XIX que busca perfeição de forma: versos com métrica e rima certinhas e temas objetivos. Lema: «a arte pela arte».", "Exemplo: Olavo Bilac, o «príncipe dos poetas»."], "simbolismo": ["Simbolismo", "Reação ao Parnasianismo: poesia mais subjetiva, misteriosa e musical, que sugere em vez de dizer, com muitos símbolos, sons e sensações.", "Exemplo: Cruz e Sousa."], "pré-modernismo": ["Pré-Modernismo", "Fase de transição (início do séc. XX): ainda não rompe com o passado, mas já traz temas novos, como a realidade do sertão e a crítica social.", "Exemplo: «Os Sertões», de Euclides da Cunha."], "modernismo": ["Modernismo", "Movimento que rompe com regras antigas: versos livres, linguagem do dia a dia e temas brasileiros. Começou com a Semana de Arte Moderna de 1922.", "Exemplo: «Macunaíma», de Mário de Andrade."], "metonímia": ["Metonímia", "Trocar um termo por outro que tem relação de proximidade com ele: autor pela obra, parte pelo todo, lugar pelo povo.", "Exemplo: «Li Machado» quer dizer que li um livro dele."], "intertextualidade": ["Intertextualidade", "Quando um texto dialoga com outro, referindo-se a ele de forma explícita (citação) ou implícita (alusão).", "Exemplo: uma música que parodia um poema famoso."], "preconceito linguístico": ["Preconceito linguístico", "Julgar uma pessoa por seu jeito de falar, como se um sotaque ou uma gíria fosse «errado» ou sinal de pouca inteligência.", "Exemplo: rir do sotaque nordestino ou do falar do interior."], "mol": ["Mol", "Unidade para contar partículas (átomos, moléculas). Assim como 1 dúzia = 12, 1 mol = 6 × 10²³.", "Exemplo: 1 mol de água tem 18 g e cerca de 6 × 10²³ moléculas."], "massa molar": ["Massa molar", "Massa de 1 mol de uma substância, em g/mol. Soma-se a massa de cada átomo da fórmula (tabela periódica).", "Exemplo: H₂O = 2 × 1 + 16 = 18 g/mol."], "reagente limitante": ["Reagente limitante", "O reagente que acaba primeiro e por isso limita a quantidade de produto. O que sobra é o reagente em excesso.", "Exemplo: 2 pães e 5 fatias de queijo fazem só 2 sanduíches: o pão limita."], "molaridade": ["Molaridade", "Concentração em mol/L: quantos mols de soluto existem em cada litro de solução.", "Exemplo: 2 mol/L significa 2 mols de soluto em 1 litro."], "diluição": ["Diluição", "Adicionar solvente a uma solução. O volume aumenta e a concentração diminui, mas a quantidade de soluto não muda.", "Exemplo: pôr água num suco concentrado."], "ppm": ["ppm (partes por milhão)", "Unidade para concentrações muito pequenas, como poluentes: 1 ppm é 1 parte de soluto em 1 milhão de partes da solução.", "Exemplo: 1 ppm ≈ 1 mg de poluente em 1 kg de água."], "neutralização": ["Neutralização", "Reação entre um ácido e uma base que forma sal e água e deixa o meio menos ácido e menos básico.", "Exemplo: o antiácido (base) reduz a acidez do estômago."], "exotérmica": ["Reação exotérmica", "Reação que libera calor para o ambiente. A energia dos produtos é menor que a dos reagentes, então ΔH é negativo.", "Exemplo: queimar gás de cozinha."], "endotérmica": ["Reação endotérmica", "Reação que absorve calor do ambiente. A energia dos produtos é maior, então ΔH é positivo.", "Exemplo: cozinhar um bolo no forno precisa de calor o tempo todo."], "variação de entalpia": ["Variação de entalpia (ΔH)", "Quanto de energia, na forma de calor, uma reação libera ou absorve a pressão constante. ΔH = H produtos − H reagentes.", "Exemplo: ΔH = −890 kJ na queima do metano: libera energia."], "lei de hess": ["Lei de Hess", "O ΔH de uma reação total é a soma dos ΔH das etapas, não importa o caminho. Permite calcular ΔH sem medir direto.", "Exemplo: subir ao 3º andar dá a mesma altura pela escada ou pelo elevador."], "oxirredução": ["Oxirredução", "Reação com troca de elétrons: uma substância perde (oxida) e outra ganha (reduz). Uma não acontece sem a outra.", "Exemplo: ferro enferrujando em contato com o oxigênio."], "eletrólise": ["Eletrólise", "Uso de corrente elétrica para forçar uma reação que não acontece sozinha. É o contrário da pilha.", "Exemplo: separar a água em hidrogênio e oxigênio."], "meia-vida": ["Meia-vida", "Tempo para a quantidade de uma substância radioativa cair pela metade. Cada material tem a sua.", "Exemplo: meia-vida de 10 anos: de 80 g sobram 40 g, depois 20 g."], "fissão e fusão": ["Fissão e fusão nuclear", "Fissão: um núcleo pesado se quebra em núcleos menores (usinas e bombas atômicas). Fusão: núcleos leves se juntam em um maior (o Sol). As duas liberam muita energia.", "Exemplo: usina nuclear usa fissão; o Sol faz fusão de hidrogênio."],"lei de ohm": ["Lei de Ohm", "A tensão é igual à resistência vezes a corrente: U = R · i. Se a tensão sobe e a resistência não muda, a corrente sobe na mesma proporção.", "Exemplo: 12 V sobre um resistor de 4 Ω gera 3 A."], "efeito joule": ["Efeito Joule", "Quando a corrente passa por um fio, parte da energia elétrica vira calor. É por isso que o fio esquenta.", "Exemplo: o chuveiro elétrico esquenta a água com um resistor."], "potência elétrica": ["Potência elétrica", "Energia usada por segundo: P = U · i. Mede o quanto um aparelho consome a cada instante, em watts (W).", "Exemplo: um chuveiro de 5 000 W gasta muito mais energia por segundo que uma lâmpada de 10 W."], "quilowatt-hora": ["Quilowatt-hora (kWh)", "Unidade de energia da conta de luz: a energia de um aparelho de 1 000 W ligado por 1 hora. Energia = potência (kW) × tempo (h).", "Exemplo: um aparelho de 2 kW ligado por 3 h consome 6 kWh."], "kwh": ["Quilowatt-hora (kWh)", "Unidade de energia da conta de luz: a energia de um aparelho de 1 000 W ligado por 1 hora. Energia = potência (kW) × tempo (h).", "Exemplo: um aparelho de 2 kW ligado por 3 h consome 6 kWh."], "efeito doppler": ["Efeito Doppler", "Mudança na frequência percebida de uma onda quando a fonte e o observador se aproximam ou se afastam. Aproximando, o som fica mais agudo; afastando, mais grave.", "Exemplo: a sirene de uma ambulância muda de tom quando ela passa por você."], "empuxo": ["Empuxo", "Força para cima que um fluido faz sobre um corpo mergulhado nele. É igual ao peso do fluido deslocado: E = d · V · g.", "Exemplo: por isso você parece mais leve dentro da piscina."], "princípio de pascal": ["Princípio de Pascal", "Uma pressão aplicada num fluido em equilíbrio, dentro de um recipiente fechado, é transmitida igualmente a todos os pontos dele.", "Exemplo: o macaco hidráulico levanta um carro com pouca força num êmbolo pequeno."], "calor sensível": ["Calor sensível", "Calor que muda a temperatura sem mudar o estado físico: Q = m · c · ΔT.", "Exemplo: esquentar água de 20 °C para 50 °C."], "calor latente": ["Calor latente", "Calor que muda o estado físico sem mudar a temperatura: Q = m · L.", "Exemplo: o gelo derretendo a 0 °C absorve calor, mas fica em 0 °C até derreter por completo."], "equilíbrio térmico": ["Equilíbrio térmico", "Situação em que corpos em contato chegam à mesma temperatura e param de trocar calor líquido. O calor vai sempre do mais quente para o mais frio.", "Exemplo: o café esfria até ficar na temperatura da sala."], "energia cinética": ["Energia cinética", "Energia do movimento: Ec = m · v² / 2. Dobrar a velocidade quadruplica a energia.", "Exemplo: um carro a 100 km/h tem 4 vezes a energia de um a 50 km/h."], "energia potencial gravitacional": ["Energia potencial gravitacional", "Energia guardada por um corpo por estar em altura: Ep = m · g · h.", "Exemplo: uma bola no alto de uma rampa pode virar movimento ao descer."], "movimento uniforme (mu)": ["Movimento uniforme (MU)", "Movimento com velocidade constante e sem aceleração: s = s₀ + v · t.", "Exemplo: um carro a 80 km/h constantes percorre 160 km em 2 h."], "muv": ["MUV (movimento uniformemente variado)", "Movimento com aceleração constante: a velocidade muda sempre o mesmo tanto a cada segundo. v = v₀ + a · t.", "Exemplo: um carro que sai do repouso e ganha 2 m/s a cada segundo."], "refração": ["Refração", "Mudança de direção e de velocidade da luz ao passar de um meio para outro.", "Exemplo: o canudo parece “quebrado” dentro do copo d’água."], "miopia": ["Miopia", "Defeito da visão em que a imagem se forma antes da retina, e por isso o longe fica borrado. Corrige-se com lente divergente.", "Exemplo: a pessoa lê bem de perto, mas não enxerga a lousa."], "hipermetropia": ["Hipermetropia", "Defeito da visão em que a imagem se forma depois da retina, e por isso o perto fica borrado. Corrige-se com lente convergente.", "Exemplo: dificuldade para ler de perto."], "função quadrática": ["Função quadrática", "Função do tipo f(x) = ax² + bx + c (com a ≠ 0). O gráfico é uma parábola.", "Exemplo: a trajetória de uma bola lançada para o alto."], "função do 1º grau": ["Função do 1º grau", "f(x) = ax + b. O gráfico é uma reta: a diz quanto y muda a cada 1 de x, e b é onde a reta corta o eixo y.", "Exemplo: táxi com bandeirada de R$ 5 mais R$ 2 por km: y = 2x + 5."], "parábola": ["Parábola", "Curva em forma de “U” (ou de “U” invertido) que é o gráfico da função quadrática.", "Exemplo: o jato de água de um chafariz."], "concavidade": ["Concavidade", "Para onde a parábola abre. Se a > 0, abre para cima (tem mínimo); se a < 0, abre para baixo (tem máximo).", "Exemplo: y = −x² + 4 abre para baixo."], "vértice": ["Vértice", "Ponto mais alto ou mais baixo da parábola: xv = −b / (2a). É o máximo ou o mínimo da função.", "Exemplo: o lucro máximo de uma empresa modelado por uma função quadrática."], "juros simples": ["Juros simples", "Juros calculados sempre sobre o valor inicial: J = C · i · t. O total cresce de forma linear.", "Exemplo: R$ 1 000 a 2% ao mês por 3 meses rendem R$ 60 de juros."], "juros compostos": ["Juros compostos", "Juros calculados sobre o valor já atualizado (juros sobre juros): M = C · (1 + i)ᵗ. O total cresce de forma exponencial.", "Exemplo: R$ 1 000 a 10% ao mês por 2 meses viram R$ 1 210."], "média ponderada": ["Média ponderada", "Média em que cada valor tem um peso: soma de (valor × peso) dividida pela soma dos pesos.", "Exemplo: notas 6 e 8 com pesos 2 e 3: (6·2 + 8·3) ÷ 5 = 7,2."], "permutação": ["Permutação", "Número de formas de organizar todos os elementos de um grupo em fila: n! (n fatorial).", "Exemplo: 3 pessoas em fila podem se organizar de 3! = 6 modos."], "arranjo": ["Arranjo", "Escolher e organizar parte dos elementos quando a ordem importa.", "Exemplo: 1º, 2º e 3º lugares entre 5 pessoas: 5 · 4 · 3 = 60."], "combinação": ["Combinação", "Escolher parte dos elementos quando a ordem não importa: C(n, p) = n! ÷ (p! · (n − p)!).", "Exemplo: formar um grupo de 2 entre 4 pessoas dá 6 grupos."], "probabilidade": ["Probabilidade", "Chance de um evento ocorrer: casos favoráveis ÷ casos possíveis. Vai de 0 (impossível) a 1 (certo).", "Exemplo: sair número par num dado: 3/6 = 1/2."], "seno": ["Seno", "No triângulo retângulo: cateto oposto ÷ hipotenusa.", "Exemplo: o ângulo de 30° tem seno 1/2."], "cosseno": ["Cosseno", "No triângulo retângulo: cateto adjacente ÷ hipotenusa.", "Exemplo: o ângulo de 60° tem cosseno 1/2."], "tangente": ["Tangente", "No triângulo retângulo: cateto oposto ÷ cateto adjacente (= seno ÷ cosseno).", "Exemplo: o ângulo de 45° tem tangente 1."], "genótipo": ["Genótipo", "O conjunto de alelos (genes) que o indivíduo tem para uma característica.", "Exemplo: AA, Aa ou aa."], "fenótipo": ["Fenótipo", "A característica que aparece no indivíduo, resultado do genótipo e do ambiente.", "Exemplo: olhos castanhos."], "heredograma": ["Heredograma", "Diagrama da família que mostra quem tem uma característica e como ela passa pelas gerações. Círculos são mulheres e quadrados, homens.", "Exemplo: ajuda a descobrir se uma condição é dominante ou recessiva."], "herança ligada ao sexo": ["Herança ligada ao sexo", "Genes localizados no cromossomo X. Como os homens têm só um X, expressam com mais facilidade as características recessivas.", "Exemplo: daltonismo e hemofilia são mais comuns em homens."], "mutualismo": ["Mutualismo", "Relação em que as duas espécies ganham e, em geral, uma não vive bem sem a outra.", "Exemplo: líquen (alga + fungo)."], "comensalismo": ["Comensalismo", "Uma espécie se beneficia e a outra não ganha nem perde.", "Exemplo: a rêmora que come restos de comida do tubarão."], "parasitismo": ["Parasitismo", "Uma espécie se beneficia e a hospedeira é prejudicada, em geral sem morrer logo.", "Exemplo: lombriga no intestino humano."], "seleção natural": ["Seleção natural", "Mecanismo da evolução de Darwin: quem tem características mais vantajosas no ambiente sobrevive e deixa mais descendentes, e essas características se espalham.", "Exemplo: bactérias resistentes a antibiótico sobrevivem e se multiplicam."], "dupla hélice": ["Dupla hélice", "Forma do DNA: duas fitas enroladas uma na outra, ligadas pelas bases nitrogenadas.", "Exemplo: parece uma escada em espiral."], "ligação fosfodiéster": ["Ligação fosfodiéster", "Liga o fosfato de um nucleotídeo ao açúcar do seguinte e forma o “esqueleto” de cada fita de DNA.", "Exemplo: é o que mantém os nucleotídeos de uma mesma fita unidos."], "eutrofização": ["Eutrofização", "Excesso de nutrientes (como esgoto e fertilizantes) na água faz as algas crescerem demais. Ao morrerem, a decomposição consome o oxigênio e os peixes morrem.", "Exemplo: lagoa esverdeada e malcheirosa perto de esgoto."], "vacina": ["Vacina", "Prepara o corpo antes da doença: tem o micróbio enfraquecido ou morto (ou partes dele), e o sistema imune cria memória.", "Exemplo: vacina contra o sarampo."], "maiêutica": ["Maiêutica", "Método de Sócrates: com perguntas, ajudar a pessoa a “dar à luz” as próprias ideias e a perceber contradições.", "Exemplo: perguntar “o que é justiça?” e questionar cada resposta."], "cogito": ["Cogito (Descartes)", "“Penso, logo existo.” Mesmo duvidando de tudo, não dá para duvidar de que se está duvidando, ou seja, pensando. É a primeira certeza.", "Exemplo: ponto de partida do racionalismo."], "contrato social": ["Contrato social", "Ideia de que a sociedade e o Estado nascem de um acordo entre as pessoas, que abrem mão de parte da liberdade em troca de ordem e proteção. Hobbes, Locke e Rousseau o descrevem de modos diferentes.", "Exemplo: obedecemos às leis porque, em tese, aceitamos esse pacto."], "banalidade do mal": ["Banalidade do mal", "Ideia de Hannah Arendt: grandes crimes podem ser cometidos por pessoas comuns que só obedecem a ordens e deixam de pensar criticamente.", "Exemplo: o julgamento de Eichmann, oficial nazista."], "globalização": ["Globalização", "Integração mundial de economia, cultura e comunicação, impulsionada por transportes e internet. Aumenta as trocas, mas também pode aumentar desigualdades.", "Exemplo: um celular com peças de vários países."], "conurbação": ["Conurbação", "Quando o crescimento de cidades vizinhas faz as áreas urbanas se encontrarem e se unirem.", "Exemplo: São Paulo e Guarulhos."], "êxodo rural": ["Êxodo rural", "Migração em massa do campo para a cidade, em busca de emprego e serviços, muito ligada à mecanização do campo.", "Exemplo: migração do Nordeste para o Sudeste no século XX."], "transição demográfica": ["Transição demográfica", "Passagem de natalidade e mortalidade altas para baixas. Primeiro a mortalidade cai e a população cresce muito; depois a natalidade cai e a população envelhece.", "Exemplo: o Brasil hoje, com a população envelhecendo."], "efeito estufa": ["Efeito estufa", "Processo natural em que gases (CO₂, metano) retêm parte do calor da Terra e mantêm o planeta habitável. O problema é o excesso, que aumenta o aquecimento global.", "Exemplo: a queima de combustíveis fósseis aumenta o CO₂."], "ilha de calor": ["Ilha de calor", "Áreas urbanas mais quentes que o entorno, por causa de asfalto, concreto, poucas árvores e muita atividade humana.", "Exemplo: o centro da cidade é mais quente que um parque."], "antropofagia": ["Antropofagia (modernismo)", "Ideia de Oswald de Andrade: “devorar” a cultura estrangeira e misturá-la com a brasileira para criar algo novo e próprio.", "Exemplo: o Abaporu, de Tarsila do Amaral, inspirou o movimento."], "guerra fria": ["Guerra Fria", "Disputa política, econômica e ideológica entre EUA (capitalismo) e URSS (socialismo) depois da Segunda Guerra, sem confronto militar direto entre os dois.", "Exemplo: a corrida espacial e a corrida armamentista."], "cubismo": ["Cubismo", "Vanguarda que mostra o objeto de vários ângulos ao mesmo tempo, com formas geométricas. Picasso é o principal nome.", "Exemplo: Guernica."], "dadaísmo": ["Dadaísmo", "Vanguarda do início do século XX que rejeitava a lógica e as regras da arte, usando o acaso e o absurdo como protesto.", "Exemplo: o “mictório” (A Fonte) de Duchamp."], "surrealismo": ["Surrealismo", "Vanguarda que explora sonhos e o inconsciente, com imagens ilógicas.", "Exemplo: os relógios derretidos de Salvador Dalí."], "futurismo": ["Futurismo", "Vanguarda que exaltava velocidade, máquinas e a vida moderna, e rompia com o passado.", "Exemplo: o manifesto de Marinetti, em 1909."], "expressionismo": ["Expressionismo", "Vanguarda que deforma formas e cores para expressar emoções intensas, mais que a realidade.", "Exemplo: O Grito, de Munch."], "metáfora": ["Metáfora", "Comparação implícita, sem “como”: um termo é usado no lugar de outro por semelhança.", "Exemplo: “Meu pai é uma rocha.”"], "personificação": ["Personificação", "Dar ações ou sentimentos humanos a seres não humanos.", "Exemplo: “O vento sussurrava segredos.”"], "ironia": ["Ironia", "Dizer o contrário do que se pensa, para criticar ou zombar.", "Exemplo: “Que dia lindo!” em meio à chuva e ao trânsito."], "antítese": ["Antítese", "Aproximar palavras ou ideias opostas.", "Exemplo: “Ri para não chorar.”"], "falsos cognatos": ["Falsos cognatos", "Palavras de duas línguas que se parecem, mas têm sentido diferente.", "Exemplo: “library” em inglês é biblioteca, não livraria."], "emotiva": ["Função emotiva", "Centrada no emissor: expressa emoções e opiniões, em geral em 1ª pessoa.", "Exemplo: “Estou muito feliz!”"], "conativa": ["Função conativa", "Centrada no receptor: tenta convencer ou mandar, com imperativo e vocativo.", "Exemplo: “Compre agora!”"], "referencial": ["Função referencial", "Centrada no assunto: informa de modo objetivo, em geral em 3ª pessoa.", "Exemplo: uma notícia de jornal."], "fática": ["Função fática", "Centrada no canal: testa ou mantém o contato.", "Exemplo: “Alô? Está me ouvindo?”"], "metalinguística": ["Função metalinguística", "Centrada no código: a linguagem fala dela mesma.", "Exemplo: um poema sobre como fazer poemas, ou um dicionário."], "poética": ["Função poética", "Centrada na mensagem: valoriza a forma, com ritmo, rima e figuras.", "Exemplo: poemas e slogans criativos."], "ácido": ["Ácido", "Substância que, em água, libera íons H⁺. Tem sabor azedo e pH menor que 7.", "Exemplo: o ácido do limão e o vinagre."], "base": ["Base", "Substância que, em água, libera íons OH⁻. Tem pH maior que 7.", "Exemplo: soda cáustica e leite de magnésia."], "destilação fracionada": ["Destilação fracionada", "Separa líquidos misturados que têm pontos de ebulição diferentes: cada um evapora numa temperatura e é recolhido em separado.", "Exemplo: o refino do petróleo em gasolina, diesel e outros derivados."]},K={};Object.keys(G).forEach(k=>K[k.toLowerCase()]=k);

  'TRI':['Teoria de Resposta ao Item (TRI)','Modelo que estima a proficiência considerando a dificuldade e o padrão de respostas. Acertar questões fáceis e médias de forma consistente tende a contribuir mais do que acertar apenas algumas difíceis.','Por isso, vale responder com atenção às questões que você domina e evitar deixar fáceis em branco.'],
  'projeção de Mercator':['Projeção de Mercator','Projeção cilíndrica conforme: preserva ângulos e formas locais, mas aumenta muito as áreas perto dos polos.','A Groenlândia parece enorme no mapa, embora seja muito menor que a África.'],
  'projeção de Peters':['Projeção de Peters','Projeção cilíndrica equivalente: mantém a proporção das áreas, mas distorce as formas dos continentes.','É útil para comparar áreas sem o exagero polar da projeção de Mercator.'],
  'projeção azimutal':['Projeção azimutal','Representa a superfície terrestre num plano que toca o globo num ponto. É especialmente útil para regiões polares e para mostrar direções a partir do centro.','Mapas centrados no Polo Norte costumam usar essa projeção.'],
  'projeção cônica':['Projeção cônica','Projeta a Terra num cone; costuma representar bem áreas de médias latitudes.','É adequada para regiões extensas no sentido leste-oeste em latitudes médias.'],
  'escala cartográfica':['Escala cartográfica','Relação entre uma distância no mapa e a distância real. Em 1:100.000, 1 cm no mapa representa 100.000 cm no terreno.','Converta as unidades antes de calcular a distância real.'],
  'curvas de nível':['Curvas de nível','Linhas que unem pontos de mesma altitude. A distância entre as linhas indica a inclinação do relevo.','Linhas próximas indicam encosta íngreme; linhas afastadas, relevo suave.'],
  'cartograma':['Cartograma (anamorfose)','Mapa em que o tamanho das áreas é alterado para representar um dado, como população ou produção.','Um país populoso pode aparecer ampliado em um cartograma de população.'],
  'latitude':['Latitude','Distância angular de um ponto até o Equador, medida para norte ou sul, de 0° a 90°.','É indicada pelos paralelos.'],
  'longitude':['Longitude','Distância angular de um ponto até o meridiano de Greenwich, medida para leste ou oeste, de 0° a 180°.','É indicada pelos meridianos e ajuda a determinar os fusos horários.'],
  'TRI (Teoria de Resposta ao Item)':['Teoria de Resposta ao Item (TRI)','Modelo estatístico usado na correção do Enem. A nota considera a dificuldade dos itens e a coerência do conjunto de respostas, não apenas a quantidade de acertos.','Duas pessoas com o mesmo número de acertos podem obter notas diferentes.'],
  'estequiometria':['Estequiometria','Cálculo das quantidades de reagentes e produtos usando os coeficientes de uma equação química balanceada.','Na reação 2H₂ + O₂ → 2H₂O, 2 mol de H₂ reagem com 1 mol de O₂.'],
  'equilíbrio químico':['Equilíbrio químico','Estado dinâmico em que as reações direta e inversa continuam ocorrendo à mesma velocidade; por isso, as concentrações ficam constantes.','Constantes não significa que a reação parou.'],
  'princípio de Le Chatelier':['Princípio de Le Chatelier','Quando um sistema em equilíbrio sofre uma mudança de concentração, pressão ou temperatura, ele tende a se ajustar para reduzir o efeito dessa mudança.','Adicionar reagente tende a favorecer seu consumo, deslocando o equilíbrio para os produtos.'],
  'número de oxidação':['Número de oxidação (NOX)','Carga formal atribuída a um átomo para acompanhar a transferência de elétrons em reações. Aumentar o NOX indica oxidação; diminuir indica redução.','Na formação de NaCl, o sódio perde elétron e é oxidado.'],
  'ânodo':['Ânodo','Eletrodo onde ocorre oxidação. Em pilhas, é o polo negativo; na eletrólise, é o polo positivo.','A regra que não muda é: ânodo = oxidação.'],
  'cátodo':['Cátodo','Eletrodo onde ocorre redução. Em pilhas, é o polo positivo; na eletrólise, é o polo negativo.','A regra que não muda é: cátodo = redução.'],
  '2ª lei de Mendel':['2ª lei de Mendel (segregação independente)','Em cruzamentos de características distintas, os pares de alelos podem se distribuir independentemente quando os genes não estão ligados.','No cruzamento AaBb × AaBb, a proporção fenotípica clássica é 9:3:3:1 sob dominância completa e segregação independente.'],
  'codominância':['Codominância','No heterozigoto, os dois alelos se expressam ao mesmo tempo, sem que um esconda o outro.','No sistema sanguíneo ABO, os alelos Iᴬ e Iᴮ são codominantes; juntos produzem o tipo AB.'],
  'dominância incompleta':['Dominância incompleta','O heterozigoto apresenta um fenótipo intermediário entre os dois homozigotos.','Em algumas flores, cruzar vermelha com branca pode produzir descendentes rosas.'],
  'reagente limitante':['Reagente limitante','Reagente que se consome primeiro e determina a quantidade máxima de produto; os demais podem sobrar.','Em uma receita, se acabam os ovos antes da farinha, os ovos limitam quantos bolos podem ser feitos.'],
  'crescimento vegetativo':['Crescimento vegetativo','Diferença entre a taxa de natalidade e a taxa de mortalidade de uma população, sem contar migrações.','Natalidade alta e mortalidade baixa produzem crescimento vegetativo positivo.'],
  'taxa de fecundidade':['Taxa de fecundidade','Número médio de filhos por mulher ao longo da vida reprodutiva, segundo as condições observadas numa população.','Sua queda costuma contribuir para o envelhecimento populacional.'],
  'repertório sociocultural':['Repertório sociocultural','Conhecimento de história, ciência, cultura, leis ou obras usado para fundamentar um argumento. Precisa ser pertinente e explicado, não apenas citado.','Uma referência à Constituição pode apoiar um argumento sobre direitos, desde que a ligação com o tema fique clara.'],
  'tópico frasal':['Tópico frasal','Frase que apresenta a ideia principal de um parágrafo de desenvolvimento.','As frases seguintes devem explicar, comprovar ou exemplificar essa ideia.'],
  'proposta de intervenção':['Proposta de intervenção','Solução apresentada na conclusão da redação do Enem. Deve indicar agente, ação, meio, finalidade e detalhamento, respeitando os direitos humanos.','Exemplo: um órgão público (agente) cria oficinas (ação) nas escolas (meio) para ampliar a educação digital (finalidade).'],
  'competência 5':['Competência 5 da redação','Critério do Enem que avalia a proposta de intervenção para o problema discutido, incluindo seus elementos e o respeito aos direitos humanos.','Uma solução vaga, sem agente ou ação definida, pode perder pontos.'],
  'desvio padrão':['Desvio padrão','Medida de quanto os valores costumam se afastar da média. Desvio pequeno indica valores mais agrupados; grande indica maior dispersão.','Duas turmas podem ter a mesma média, mas notas mais espalhadas numa delas.'],
  'concentração molar':['Concentração molar (molaridade)','Quantidade de matéria do soluto, em mol, dividida pelo volume total da solução, em litros: M = n/V.','2 mol em 1 L correspondem a 2 mol/L.'],
  'diluição':['Diluição','Adição de solvente que reduz a concentração sem alterar a quantidade de soluto. Para a mesma substância, C₁V₁ = C₂V₂.','Ao adicionar água a um suco concentrado, o volume aumenta e o sabor fica menos intenso.'],
  'efeito fotoelétrico':['Efeito fotoelétrico','Emissão de elétrons por um material quando recebe luz com frequência suficientemente alta. A energia depende da frequência da luz, não apenas de sua intensidade.','É um exemplo de fenômeno explicado pela natureza quântica da luz.'],
  'ondas eletromagnéticas':['Ondas eletromagnéticas','Ondas formadas por campos elétrico e magnético oscilantes; não precisam de um meio material e podem viajar no vácuo.','Luz visível, ondas de rádio e raios X são exemplos.'],
  'média aritmética':['Média aritmética','Some os valores e divida pela quantidade de observações: M = soma ÷ n. A média usa todos os dados, por isso pode ser puxada por valores muito altos ou muito baixos.','Para 2, 4 e 9: (2 + 4 + 9) ÷ 3 = 5.'],
  'mediana':['Mediana','Valor central depois de ordenar os dados. Se a quantidade for par, calcule a média dos dois valores centrais.','Em 1, 4, 8, a mediana é 4; em 1, 4, 8, 10, é (4 + 8) ÷ 2 = 6.'],
  'moda':['Moda','Valor ou categoria que aparece com maior frequência. Pode haver mais de uma moda ou nenhuma, se todas as frequências forem iguais.','Em 2, 3, 3, 5, a moda é 3; a frequência (duas vezes) não é a moda.'],
  'desvio padrão':['Desvio padrão','Medida de dispersão que resume o afastamento dos dados em relação à média. Um valor menor indica dados mais concentrados; um maior indica mais variação.','Dois grupos podem ter a mesma média, mas aquele com notas mais espalhadas terá maior desvio padrão.'],
  'coeficiente angular':['Coeficiente angular','Na função f(x) = ax + b, o coeficiente a indica a inclinação da reta e quanto f(x) varia quando x aumenta uma unidade.','Se a > 0 a reta cresce; se a < 0, decresce.'],
  'raiz da função':['Raiz de uma função','Valor de x que faz f(x) = 0; no gráfico, é onde a curva cruza ou toca o eixo x.','Em f(x) = 2x − 6, a raiz é x = 3.'],
  'vértice da parábola':['Vértice da parábola','Ponto de máximo ou mínimo da função quadrática. Para ax² + bx + c, xv = −b/(2a) e yv = f(xv) = −Δ/(4a).','Se a > 0 o vértice é mínimo; se a < 0 é máximo.'],
  'escala cartográfica':['Escala cartográfica','Relação entre uma medida no mapa e a medida real, expressas na mesma unidade. Em 1:100.000, 1 cm no mapa representa 100.000 cm (1 km) no terreno.','Antes de calcular, converta as unidades para evitar confundir centímetros com quilômetros.'],
  'curvas de nível':['Curvas de nível','Linhas de um mapa que unem pontos de mesma altitude. A distância entre as curvas indica a inclinação do terreno.','Curvas próximas representam encosta íngreme; curvas afastadas, relevo mais suave.'],
  'conurbação':['Conurbação','União física das áreas urbanizadas de cidades vizinhas que cresceram até se encontrar. Não significa que as cidades perderam seus limites administrativos.','A continuidade de construções entre municípios pode formar uma área metropolitana.'],
  'transição demográfica':['Transição demográfica','Mudança histórica de altas taxas de natalidade e mortalidade para taxas menores. Em geral, a mortalidade cai primeiro; depois, a natalidade também diminui e a população envelhece.','O ritmo e o momento dessa transição variam entre países e regiões.'],
  'seleção natural':['Seleção natural','Processo em que características hereditárias que favorecem a sobrevivência e a reprodução num ambiente tendem a se tornar mais comuns ao longo das gerações. Indivíduos não evoluem porque “precisam”.','Bactérias resistentes sobrevivem ao antibiótico e podem deixar descendentes resistentes.'],
  'deriva genética':['Deriva genética','Mudança aleatória na frequência dos alelos entre gerações, mais forte em populações pequenas. Diferentemente da seleção natural, não depende de a característica ser vantajosa.','Uma enchente pode eliminar ao acaso muitos indivíduos e mudar as frequências genéticas dos sobreviventes.'],
  'rendimento da reação':['Rendimento da reação','Razão entre a quantidade de produto realmente obtida e a quantidade teórica prevista, geralmente expressa em porcentagem: rendimento = real ÷ teórico × 100%.','Se a previsão é 50 g e foram obtidos 40 g, o rendimento é 80%.'],
  'equilíbrio químico':['Equilíbrio químico','Estado dinâmico em que as velocidades das reações direta e inversa são iguais. As concentrações ficam constantes, embora as reações continuem ocorrendo.','Constante não quer dizer que as concentrações dos reagentes e produtos sejam iguais.'],
  'entalpia':['Entalpia (H) e variação de entalpia (ΔH)','Grandeza usada para acompanhar a energia térmica de um sistema a pressão constante. Para uma reação, ΔH = H dos produtos − H dos reagentes; sinal negativo indica liberação de calor.','Inverter a reação troca o sinal de ΔH; multiplicar os coeficientes por um fator multiplica ΔH pelo mesmo fator.'],
  'efeito doppler':['Efeito Doppler','Mudança da frequência percebida quando há movimento relativo entre a fonte e o observador. Aproximação aumenta a frequência percebida; afastamento a diminui.','A sirene de uma ambulância parece mais aguda ao se aproximar e mais grave ao se afastar.'],
  'tese':['Tese','Na redação dissertativo-argumentativa, é a posição central que o autor defende sobre o tema. Os parágrafos de desenvolvimento devem apresentar razões que sustentem essa posição.','Tema: mobilidade urbana. Tese: ampliar o transporte público é essencial para reduzir desigualdades e congestionamentos.'],
  'inferência':['Inferência','Conclusão que o leitor tira a partir de pistas do texto e do contexto, mesmo quando ela não está escrita literalmente. Deve ser apoiada pelo que o texto mostra.','Se a personagem fecha o guarda-chuva e entra molhada, é possível inferir que chovia; não se pode inferir onde ela mora sem outras pistas.'],
  'densidade':['Densidade','Relação entre massa e volume: d = m/V. Não confunda densidade com peso; o peso é uma força que depende da gravidade.','Um objeto pequeno e pesado pode ser mais denso que um objeto grande e leve.'],
  'pressão':['Pressão','Força distribuída por uma área: p = F/A. Para a mesma força, diminuir a área aumenta a pressão.','Uma faca afiada corta melhor porque concentra a força numa área menor.'],
  'massa':['Massa','Grandeza que mede a quantidade de matéria e a inércia de um corpo; costuma ser medida em kg. Não é o mesmo que peso.','A massa de uma pessoa permanece praticamente igual na Terra e na Lua, mas seu peso muda com a gravidade.'],
  'peso':['Peso','Força gravitacional sobre um corpo: P = m × g. É medido em newtons (N), e varia conforme a gravidade local.','A mesma pessoa tem peso menor na Lua do que na Terra, embora sua massa não mude.']
});
Object.keys(G).forEach(k=>K[norm(k)]=k);
const findKey=b=>K[norm(b.textContent)];
const mark=b=>{const k=findKey(b);if(!k||b.closest('button,a,label'))return false;b.classList.add('gl');b.dataset.gl=k;b.setAttribute('role','button');b.tabIndex=0;return true};
const mk=root=>{(root||document).querySelectorAll('b').forEach(mark)};
let tm;new MutationObserver(records=>{clearTimeout(tm);tm=setTimeout(()=>{records.forEach(r=>{if(r.target.nodeType===1&&r.target.matches('b'))mark(r.target);r.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.matches('b'))mark(n);mk(n)}})});mk()},0)}).observe(document.body,{childList:true,characterData:true,subtree:true});mk();
const o=document.getElementById('glo'),bx=o.firstChild,sh=k=>{const g=G[k];if(!g)return;bx.innerHTML='<h3>'+g[0]+'</h3><small>Resumo</small><p>'+g[1]+'</p><p class="ex">'+g[2]+'</p><button type="button">Entendi</button>';o.classList.add('on')};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('b');if(!b||b.closest('button,a,label'))return;const k=findKey(b);if(k){mark(b);e.preventDefault();e.stopPropagation();sh(k)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')o.classList.remove('on');else if(e.key==='Enter'){const b=e.target.closest&&e.target.closest('b'),k=b&&!b.closest('button,a,label')&&findKey(b);if(k)sh(k)}});
o.addEventListener('click',e=>{if(e.target===o||e.target.tagName==='BUTTON')o.classList.remove('on')})})();
</script>

  ov.classList.add('show');
})();
