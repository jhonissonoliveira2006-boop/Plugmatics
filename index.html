<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plugmatics</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1b2233;--mute:#6b7488;--line:#dde2ec;--sh:0 6px 18px rgba(30,40,70,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1c2230;--ink:#eef1f8;--mute:#98a2b8;--line:#2d3649;--sh:0 6px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1c2230;--ink:#eef1f8;--mute:#98a2b8;--line:#2d3649;--sh:0 6px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;min-width:0;padding:16px 16px 28px;overflow-x:clip}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.5px}
.logo{display:inline-block;background:#12161f;color:#fff;padding:6px 16px 8px;border-radius:14px;font-weight:900;letter-spacing:-.5px;line-height:1.1;box-shadow:var(--sh)}
.logo .lp{color:#e5484d}.logo .ll{color:#f5c518}.logo .lu{color:#30a46c}.logo .lg{color:#3b82f6}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:800;padding:11px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.t{position:relative;border:0;text-align:left;font:inherit;color:#fff;border-radius:18px;padding:16px;min-height:104px;cursor:pointer;background:hsl(var(--h) 62% 50%);box-shadow:var(--sh);transition:transform .15s}
.t:active,.m:active{transform:scale(.97)}
.t b{font-size:38px;line-height:1;display:block}
.t small{display:block;margin-top:8px;opacity:.92;font-weight:700}
.t.lock{background:var(--line);color:var(--mute);cursor:not-allowed;box-shadow:none}
.t .ck{position:absolute;right:12px;top:10px;font-size:18px}
.m{display:block;width:100%;border:0;text-align:left;font:inherit;color:#fff;border-radius:20px;padding:18px 20px;margin-bottom:12px;cursor:pointer;background:hsl(var(--h) 62% 50%);box-shadow:var(--sh);transition:transform .15s}
.m b{font-size:22px;display:block}
.m small{display:block;margin-top:4px;opacity:.92;font-weight:700;font-size:14px}
.ar{margin:22px 0 10px;padding:9px 14px;border-radius:12px;color:#fff;font-weight:900;font-size:14px;line-height:1.25;background:hsl(var(--h) 55% 36%)}
.fr{display:flex;gap:8px;margin-bottom:12px}.fr .m{flex:1;width:auto;min-width:0;margin-bottom:0}
.pp{flex:none;width:78px;border:0;border-radius:20px;background:hsl(var(--h) 45% 30%);color:#fff;font:inherit;font-size:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;box-shadow:var(--sh)}.pp small{font-size:11px;font-weight:800;margin-top:2px;line-height:1.1;text-align:center}
.eqw.col{flex-direction:column;flex-wrap:nowrap;align-items:stretch}.eqw.col .sl{width:100%;flex:none}
.sl.rl{justify-content:flex-start;text-align:left}.sl.rl:empty::before{content:attr(data-l);color:var(--mute);font-weight:800;font-size:13px}
.wx{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(229,72,77,.12);border:1px solid #e5484d;font-size:14px;line-height:1.4}
.wxf{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;z-index:60;display:none;padding:10px 12px;border-radius:14px;background:var(--card);border:2px solid #e5484d;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;line-height:1.4}.wxf.show{display:block;animation:pop .25s}
.wxh{font-weight:900;font-size:12px;color:#e5484d;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.sec{margin:22px 0 10px}
.sh{display:flex;align-items:stretch;gap:6px;border-radius:12px;color:#fff;background:hsl(var(--h) 55% 36%)}
.st{flex:1;display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;color:inherit;font:inherit;font-weight:900;font-size:14px;line-height:1.25;padding:10px 6px 10px 14px;cursor:pointer}
.cv{display:inline-block;transition:transform .2s}.sec.open .cv{transform:rotate(90deg)}
.dk{flex:none;align-self:center;margin-right:8px;border:0;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font:inherit;font-weight:800;font-size:13px;padding:7px 10px;cursor:pointer}
.sb{display:none;margin-top:10px}.sec.open .sb{display:block}
.dc{background:var(--card);border:1px solid var(--line);border-left:5px solid hsl(var(--h) 62% 50%);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.dc b{display:block;font-size:15px}.dc p{margin:5px 0 0;color:var(--mute);font-size:14px;line-height:1.4}
.mol{width:100%;max-height:150px;height:auto;display:block;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none;color:var(--ink)}
.mol text{fill:currentColor;stroke:none;font:700 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.mb{fill:var(--card);stroke:none}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fig{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;color:var(--ink);cursor:pointer}
.fig.sel{border-color:#3b82f6}.fig.ok{border-color:#1e9e5a;opacity:.7}
.nmw{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.nmb{flex:1 1 40%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;border-radius:14px;padding:12px 8px;cursor:pointer}
.nmb.ok{border-color:#1e9e5a;background:#1e9e5a22}.nmb.bad{border-color:#e5484d;background:#e5484d22}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer}
.ttl{flex:1;font-weight:900;font-size:20px}
.tm{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:96px;text-align:center}
.tm.g{color:#1e9e5a}.tm.o{color:#e07a1f}
.best{color:var(--mute);font-size:13px;margin:-4px 0 10px;text-align:right}
.board{display:grid;gap:10px}
.row{display:flex;align-items:center}
.ex{position:relative;flex:1.1;height:56px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#fff;background:hsl(var(--h) 62% 50%);border-radius:12px 0 0 12px}
.sl{position:relative;flex:.9;height:56px;border:2px dashed var(--line);border-left:0;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#fff;padding-left:12px;cursor:pointer}
.sl.rs{flex:1.2;border-radius:0 12px 12px 0}
.rs::before{content:"=";margin-right:6px;color:var(--mute)}
.sl.ok{border:0;background:hsl(var(--h) 62% 40%);animation:pop .35s}
.sl.ok.rs::before{color:#fff;opacity:.7}
.sl.bad{animation:shake .35s;border-color:#e5484d}
.kn{position:absolute;right:-12px;top:var(--y);width:24px;height:24px;margin-top:-12px;background:inherit;z-index:3}
.s0{border-radius:50%}.s1{border-radius:3px}.s2{border-radius:3px;transform:rotate(45deg)}.s3{border-radius:50% 50% 3px 3px}
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:20;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;background:var(--card);border:1px solid var(--line);border-bottom:0;box-shadow:0 -8px 24px rgba(0,0,0,.14)}
.pc{position:relative;overflow:hidden;height:56px;border-radius:12px;background:hsl(var(--h) 62% 40%);color:#fff;font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ho{position:absolute;left:-12px;top:var(--y);width:24px;height:24px;margin-top:-12px;background:var(--card)}
.ut{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sl.us{flex:none;height:64px;border:2px dashed var(--line);border-radius:12px;padding:0;font-size:15px}
.sl.us.ok{border:0}
.pc.pu{width:56px;height:56px;font-size:17px}
.pc.po{width:80px;font-size:22px}
.ux{flex:.6;font-size:20px;border-radius:12px 0 0 12px}
.sl.nm{flex:1.8;font-size:15px;border-radius:0;padding-left:8px}
.sl.eq{flex:1.4;font-size:15px}
.pc.pt{width:auto;min-width:56px;padding:0 10px;height:46px;font-size:14px}
.ex.fn{flex:1;font-size:14px;line-height:1.15;padding:0 8px;text-align:center}
.sl.fs{flex:1.5;font-size:15px;line-height:1.15;padding:0 6px;text-align:center;border-radius:0 12px 12px 0}
.pc.pf2{font-size:13px;min-width:0;padding:0 9px;height:42px}
.az{display:flex;align-items:center;gap:12px;margin:12px 0}
.az .sl{flex:none;width:92px;height:48px;font-size:20px}
.az.off{opacity:.3}
.al{flex:1;position:relative;height:5px;border-radius:3px;background:hsl(var(--h) 62% 50%)}
.al.r::after{content:"";position:absolute;right:-3px;top:-8px;border:10px solid transparent;border-left:16px solid hsl(var(--h) 62% 50%);border-right:0}
.al.l::after{content:"";position:absolute;left:-3px;top:-8px;border:10px solid transparent;border-right:16px solid hsl(var(--h) 62% 50%);border-left:0}
.ar{display:flex;gap:14px;margin-top:22px}
.ac{flex:1;text-align:center}
.ac .sl{width:100%;font-size:22px}
.ah{font-size:46px;line-height:1;color:hsl(var(--h) 62% 50%);font-weight:900;margin-top:4px}
.pf{width:48px}.pr{width:62px}
.fh{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:20px;color:#fff;background:hsl(var(--h) 62% 50%);border-radius:14px;padding:14px}
.eqw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.sl.fut{display:none}.sl.rev{animation:pop .35s}
.stp{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);text-align:center;margin-top:8px}
.sl.tk{flex:none;min-width:46px;height:52px;border:2px dashed var(--line);border-radius:10px;padding:0 8px;font-size:22px}
.sl.tk.ok{border:0}
.pc.tp{min-width:46px;height:50px;padding:0 10px;font-size:22px}
.m.lock{background:var(--line);color:var(--mute);cursor:not-allowed;box-shadow:none}
.rb{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.rt{font-size:16px;line-height:1.45;margin-bottom:8px}
.rt b{color:hsl(var(--h) 62% 55%)}
.rv{font-size:22px;font-weight:900;text-align:center;padding:10px;margin-bottom:10px;border-radius:12px;background:var(--bg);color:hsl(var(--h) 62% 55%)}
.lad{display:grid;gap:6px;justify-content:center}
.lr{display:flex;align-items:center;gap:8px}
.bs{width:46px;height:46px;border-radius:10px;color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
.bd{color:var(--mute);font-size:22px;width:32px;text-align:center}
.rv.sv{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:400;padding:8px}
.pc.neu{background:#59627a}.pc.same{background:hsl(var(--h) 62% 50%)}
.pc.sel{outline:3px solid var(--ink);outline-offset:2px}
.pc.drag{z-index:50;cursor:grabbing;box-shadow:0 12px 24px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(10,14,25,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}
.ov.show{display:flex}
.box{background:var(--card);border-radius:24px;padding:26px 22px;width:100%;max-width:360px;text-align:center;animation:pop .4s}
.stars{font-size:38px;letter-spacing:6px}
.box h2{margin:6px 0 4px}.box p{margin:4px 0;color:var(--mute)}
.big{font-size:42px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px;background:hsl(var(--h) 62% 46%);color:#fff}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.hb{display:flex;align-items:center;justify-content:center;padding:0}
.bulb{width:26px;height:26px;display:block;overflow:visible}
.hl{text-align:left;max-height:55vh;overflow:auto;margin:12px 0 4px}
.hr{padding:9px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:16px}
.hr:last-child{border-bottom:0}
.hr b{font-weight:900}
.hr small{display:block;color:var(--mute);font-size:13px;margin-top:3px;line-height:1.35}
.hr.dn{opacity:.5}
.hx{text-align:left;color:var(--mute);font-size:14px;line-height:1.4;margin:6px 0 0}
.hx b{color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}

/* caixas de texto longo (comando, ação, significado das letras) crescem com o conteúdo */
.cmdw{display:grid;gap:8px}
.cmd{background:hsl(var(--h) 62% 50%);color:#fff;font-weight:800;font-size:17px;line-height:1.3;padding:14px 16px;border-radius:14px;text-align:left}
.sl.lg{height:auto;min-height:56px;width:auto;padding:10px 12px;font-size:15px;line-height:1.25;text-align:center;white-space:normal;overflow-wrap:anywhere}
.cmdw .sl.lg{flex:none;width:100%;border:2px dashed var(--line);border-radius:12px;min-height:64px;font-size:16px}
.cmdw .sl.lg.ok{border:0}
.row.lgr{align-items:stretch}
.row.lgr .ex{height:auto;min-height:56px}
.row.lgr .sl.lg{flex:1.8;width:auto;border:2px dashed var(--line);border-left:0;border-radius:0 12px 12px 0}
.row.lgr .sl.lg.ok{border:0}
.pc.lg{height:auto;min-height:46px;max-width:100%;padding:9px 12px;font-size:15px;line-height:1.25;text-align:center;white-space:normal;overflow:visible}
.pc.lg.wide{flex:1 1 100%}
.ex.fn{height:auto;min-height:56px}
.sl.fs{height:auto;min-height:56px;padding-top:6px;padding-bottom:6px}
.pc.pf2{height:auto;min-height:42px;white-space:normal;padding-top:8px;padding-bottom:8px;text-align:center}
/* Geografia: mapa */
.mapw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;max-width:560px;margin:8px auto 0;width:100%}
#msvg{display:block;width:100%;height:auto;max-height:60vh;touch-action:manipulation}
.ms{stroke:currentColor;stroke-opacity:.5;stroke-width:.9;stroke-linejoin:round;cursor:pointer}
.ms.ctx{fill:hsl(210 10% 55% / .10);stroke-opacity:.22;cursor:default;pointer-events:none}
.ms.tg{fill:hsl(210 20% 55% / .22)}
.ms.fill{fill:hsl(var(--rh) 62% 45%);stroke:#fff;stroke-opacity:.9;animation:popm .45s}
.ms.bad{animation:blinkm .45s}
.ms.hint{animation:hlm .5s ease-in-out 3 alternate}
@keyframes popm{from{fill-opacity:.15}to{fill-opacity:1}}
@keyframes blinkm{50%{fill:hsl(5 75% 55%)}}
@keyframes hlm{to{fill:hsl(48 95% 55%)}}
.ml{fill:#fff;font-weight:800;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:1.4;stroke-linejoin:round}
.mpc{position:relative;display:flex;align-items:center;gap:12px;background:hsl(var(--h) 62% 40%);color:#fff;border-radius:16px;padding:8px 16px 8px 10px;font-weight:900;font-size:19px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.mpc.sel{outline:3px solid var(--ink);outline-offset:2px}
.mpc.drag{z-index:50;cursor:grabbing;box-shadow:0 12px 24px rgba(0,0,0,.3)}
.mbt{display:flex;gap:8px}
.mb{border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:15px;border-radius:12px;padding:10px 14px;cursor:pointer}
.mb:disabled{opacity:.4}

.mapw{position:relative}
#msvg{touch-action:none}
.mz{position:absolute;top:10px;right:10px;display:grid;gap:6px;z-index:5}
.mz button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:900;cursor:pointer;line-height:1}
.ms.aim{stroke:#ffd23f;stroke-opacity:1;stroke-width:2.4}
.mpc{display:flex;align-items:center;gap:12px;font-weight:900;font-size:19px;color:var(--ink);user-select:none;background:none;box-shadow:none;padding:0;border-radius:0;outline:0;cursor:default}
.mpc.sel,.mpc.drag{outline:0;box-shadow:none}
.mps{overflow:visible;pointer-events:none;transition:opacity .15s}
.mps path{pointer-events:auto;cursor:grab;touch-action:none}
.mps.lift{opacity:.3}
.mfx{flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;text-align:left;font-size:12.5px;line-height:1.3;color:var(--ink);border-top:1px solid var(--line);padding-top:10px}
.mfx b{display:block;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute)}
.mfx .mft{grid-column:1/-1;font-weight:900;font-size:15px}
.pcard{background:var(--card);border:1px solid var(--line);border-left:6px solid hsl(var(--h) 62% 45%);border-radius:14px;padding:12px 14px;margin:0 0 10px;display:grid;gap:4px;text-align:left}
.pcard b{font-size:16px}.pcard span{font-size:13px;font-weight:800;color:hsl(var(--h) 55% 40%)}
@media (prefers-color-scheme:dark){.pcard span{color:hsl(var(--h) 65% 70%)}}
.pcard p{margin:0;font-size:13.5px;line-height:1.4;color:var(--mute)}
/* Evita que textos, fórmulas e títulos longos ultrapassem cartões em telas estreitas. */
#app .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
#app .top>*{min-width:0}
#app :is(.m,.t,.sub,.ttl,.dc,.rb,.rt,.rv,.hx,.wx,.hr,.cmd,.ar,.pcard,.pcard *, .sl){overflow-wrap:anywhere}
#app :is(.row,.fr,.sh,.mcard){min-width:0}
#app .row>*{min-width:0}
#app .mfx{grid-template-columns:repeat(2,minmax(0,1fr))}
.pj{width:64px;height:48px;flex:none;color:hsl(var(--h) 60% 45%)}
.pcard .ph{display:flex;gap:12px;align-items:center}.pcard .ph>div{display:grid;gap:4px}
.mfx .mfn{grid-column:1/-1;color:var(--mute);font-size:11px}
@media (max-width:420px){.mfx{font-size:12px;gap:5px 10px}}
.mgh{position:fixed;left:0;top:0;pointer-events:none;z-index:60;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.frc{display:inline-flex;flex-direction:column;align-items:center;gap:5px}.frn,.frd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sl.tk.bar{align-self:stretch;height:16px;min-height:0;min-width:80px;padding:0;font-size:0;line-height:0;border-radius:4px}.sl.tk.bar.ok{height:5px;border:0}
.pbk{flex:0 0 100%;height:18px}
.mas-on .hb{display:none}
.mas-on .rb,.mas-on .best,.mas-on .rt,.mas-on .sub{display:flow-root}
.mchar{float:left;position:relative;width:60px;height:60px;margin:0 8px 8px 0;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;box-shadow:var(--sh)}
.mcv{display:block;width:100%;height:100%}
.mchar canvas,.mcard canvas,.mbox{image-rendering:pixelated}
.mchar canvas{display:block;width:100%;height:100%;animation:mbob 3s ease-in-out infinite}

.mchar.mfx{position:fixed;z-index:14;margin:0;box-sizing:border-box;width:60px;height:60px;min-width:60px;min-height:60px;max-height:60px;aspect-ratio:1/1;padding:4px;display:block;transform-origin:center}
.mchar.mfx canvas{width:50px;height:50px;min-width:50px;min-height:50px;aspect-ratio:1/1}
.mslot{float:left;box-sizing:border-box}
.mchar[data-area=ling] canvas,.mchar[data-area=ling][data-t] canvas,.mchar[data-area=ling] .mcv,.mchar[data-area=red] canvas,.mchar[data-area=red][data-t] canvas,.mchar[data-area=red] .mcv{animation:none!important}
.mchar[data-t=feliz] canvas{animation:tkf .28s ease-in-out infinite}
.mchar[data-t=neutro] canvas{animation:tkn .45s ease-in-out infinite}
.mchar[data-t=serio] canvas{animation:tks .7s steps(2) infinite}
.mchar[data-t=provocativo] canvas{animation:tkp .6s ease-in-out infinite}
.mchar[data-t=cansado] canvas{animation:tkc 1.3s ease-in-out infinite}
.mchar[data-t=alegre] canvas{animation:tka .2s ease-in-out infinite}
@keyframes tkf{50%{transform:translateY(-3px)}}
@keyframes tkn{50%{transform:scaleY(.95)}}
@keyframes tks{50%{transform:translateY(1px)}}
@keyframes tkp{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes tkc{50%{transform:translateY(3px) scaleY(.92)}}
@keyframes tka{50%{transform:translateY(-3px) scale(1.04)}}
.mchar.a-hop .mcv{animation:mhop var(--rt,.6s) var(--re,ease)}.mchar.a-spin .mcv{animation:rsp var(--rt,.6s) var(--re,ease)}.mchar.a-wig .mcv{animation:rwg var(--rt,.6s) var(--re,ease)}.mchar.a-sag .mcv{animation:rsg var(--rt,.6s) var(--re,ease)}
.mchar.a-pop .mcv{animation:rpp var(--rt,.6s) var(--re,ease)}.mchar.a-shk .mcv{animation:shake var(--rt,.6s) var(--re,ease)}.mchar.a-nod .mcv{animation:rnd var(--rt,.6s) var(--re,ease)}.mchar.a-lean .mcv{animation:rln var(--rt,.6s) var(--re,ease)}
.mchar.a-jit .mcv{animation:rjt var(--rt,.6s) var(--re,ease)}.mchar.a-flip .mcv{animation:rfl var(--rt,.6s) var(--re,ease)}.mchar.a-tilt .mcv{animation:rtl var(--rt,.6s) var(--re,ease)}.mchar.a-drop .mcv{animation:rdr var(--rt,.6s) var(--re,ease)}
@keyframes rsp{40%{transform:translateY(-10px) rotate(180deg)}to{transform:rotate(360deg)}}
@keyframes rwg{20%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
@keyframes rsg{40%,80%{transform:translateY(5px) scale(1.06,.85)}}
@keyframes rpp{40%{transform:scale(1.3)}}
@keyframes rnd{30%{transform:translateY(4px)}60%{transform:translateY(0)}80%{transform:translateY(3px)}}
@keyframes rln{40%,70%{transform:rotate(11deg) translateX(3px)}}
@keyframes rjt{15%{transform:translateX(-4px)}35%{transform:translateX(4px)}55%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes rfl{50%{transform:scaleX(-1)}}
@keyframes rtl{30%,80%{transform:rotate(-15deg) translateY(2px)}}
@keyframes rdr{35%{transform:translateY(7px)}55%{transform:translateY(-3px)}}
@keyframes mhop{25%{transform:translateY(2px) scale(1.08,.9)}55%{transform:translateY(-10px) scale(.95,1.06)}}
.mcf{position:absolute;top:24px;width:6px;height:6px;pointer-events:none;animation:mfly .9s ease-out forwards}
@keyframes mfly{to{transform:translate(var(--dx),var(--dy)) rotate(180deg);opacity:0}}
.mcard{flex-wrap:wrap;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:16px}
.mcard canvas{width:48px;height:48px;flex:none}.mcard.off canvas{opacity:.45}
.mcard>div{flex:1;min-width:0}.mcard b{display:block}.mcard small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.mtg{flex:none;border:2px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:800;font-size:13px;border-radius:12px;padding:9px 10px;cursor:pointer}
.mbox{display:block;margin:0 auto 4px;width:84px;height:84px}
.mbs{display:flex;gap:8px;flex:1 1 100%}.mbs .mtg{flex:1}
.mhum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-6px 0 16px}
.mhum .mtg{padding:9px 4px;font-size:12px}.mtg.on{background:var(--ink);color:var(--bg)}
.mcard{min-width:0}.mbs{min-width:0}.mbs .mtg{min-width:0;padding:9px 6px;font-size:12.5px;line-height:1.2}
.mcard>.mbs{flex:1 1 100%}.mbs .mtg{white-space:nowrap}

.mc{margin-bottom:4px}.mc .mcard{margin-bottom:10px}
.mhum{display:none;margin:-2px 0 12px}.mhum.open{display:grid}
.mrow{display:flex;gap:6px}.mcard>.mrow{flex:1 1 100%}.mrow>div{flex:1;min-width:0;text-align:center}.mrow canvas{display:block;margin:0 auto 2px}.mrow small{font-size:11px}
.mdv{font-weight:600;color:var(--mute);font-size:12px}

let fNat=false,fSub='f',liSub='lit',cSub='bio',aOpen=[];const NK=['f','fm','fc','fe','qa','qb'];
const $=s=>document.querySelector(s);
const rnd=a=>a.sort(()=>Math.random()-.5);

let mode='lin',kind='tab',bk=0,total=20,ttl='',cur=0,placed=0,miss=0,t0=0,tick=null,sel=null,AC=null;

store.fb=store.fb||{};

const hue=n=>({3:200,4:150,5:35,6:280,7:340,8:12,9:230})[n];
const fmt=ms=>{const s=ms/1000,m=Math.floor(s/60);return m+':'+(s%60).toFixed(1).padStart(4,'0')};

let uType='c',uN=7,fType='g',fMode='match',fIdx=0,rIdx=0,rb=0,rcum=[],RS=null,rk='r';

function musicStop(){clearInterval(mTimer);mTimer=null}
function musicStart(){
  musicStop();if(mus==='off')return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){return}
  const F=m=>440*Math.pow(2,m/12),calm=mus==='calm',step=calm?1.1:.29;
  const tone=(f,t,d,ty,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(calm?.4:.012));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)};
  const ch=[[0,[0,3,7]],[-4,[0,4,7]],[-9,[0,4,7]],[-2,[0,4,7]]];
  let nt=AC.currentTime+.1,i=0;
  const sched=(t,i)=>{
    const c=ch[Math.floor(i/(calm?4:8))%4],r=c[0],iv=c[1];
    if(calm){
      if(i%4===0)iv.forEach(x=>tone(F(r+x-12),t,5,'triangle',.03));
      if(Math.random()<.8)tone(F(r+iv[Math.floor(Math.random()*3)]+12*(Math.random()<.5?1:0)),t,3.2,'sine',.05);
    }else{
      const p=[0,1,2,1,0,1,2,1][i%8];tone(F(r+iv[p]+12),t,.26,'triangle',.05);
      if(i%4===0)tone(F(r-24),t,.55,'sine',.12);
    }
  };
  mTimer=setInterval(()=>{while(nt<AC.currentTime+.3){sched(nt,i++);nt+=step}},60);
}
function setMus(v){mus=v;try{localStorage.setItem('tabuada_mus',v)}catch(e){}musicStart();home()}
function cycleMus(b){mus=mus==='off'?'calm':mus==='calm'?'focus':'off';try{localStorage.setItem('tabuada_mus',mus)}catch(e){}musicStart();b.textContent=musIc()}
const musIc=()=>mus==='off'?'🔇':mus==='calm'?'🌿':'🎯';
const musUI=()=>`<div class="seg">${[['off','Sem música'],['calm','🌿 Calma'],['focus','🎯 Foco']].map(m=>`<button class="${mus===m[0]?'on':''}" onclick="setMus('${m[0]}')">${m[1]}</button>`).join('')}</div>`;
const kh=k=>`<i class="kn s${k.s}" style="--y:${k.y}%"></i>`;

function snd(type,k){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    if(type==='ok'){
      const sc=[0,2,4,7,9,12,14,16,19,21],f=392*Math.pow(2,sc[k%10]/12);
      o.type='triangle';o.frequency.setValueAtTime(f*0.7,t);o.frequency.exponentialRampToValueAtTime(f,t+.05);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
      o.start(t);o.stop(t+.3);
      const c=AC.createOscillator(),h=AC.createGain();c.type='square';c.frequency.setValueAtTime(180,t);c.frequency.exponentialRampToValueAtTime(60,t+.05);
      c.connect(h);h.connect(AC.destination);h.gain.setValueAtTime(.3,t);h.gain.exponentialRampToValueAtTime(.0001,t+.07);c.start(t);c.stop(t+.08);
    }else if(type==='bad'){
      o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(90,t+.18);
      g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22);
    }else{
      [523,659,784,1047].forEach((f,i)=>{const a=AC.createOscillator(),b=AC.createGain();a.type='triangle';a.frequency.value=f;
      a.connect(b);b.connect(AC.destination);const s=t+i*.12;b.gain.setValueAtTime(.0001,s);b.gain.exponentialRampToValueAtTime(.3,s+.02);b.gain.exponentialRampToValueAtTime(.0001,s+.4);a.start(s);a.stop(s+.45)});
    }
  }catch(e){}
}

  S(0,'Linguagens, Códigos e suas Tecnologias',330,B('artMenu()','Artes','Vanguardas, Modernismo, arte contemporânea e cultura popular',330)+B('litMenu()','Literatura','Escolas literárias, características e autores',330)+B('ptMenu()','Língua Portuguesa','Funções e figuras de linguagem, variação, interpretação e leitura em inglês e espanhol',330))+
  S(1,'Ciências Humanas e suas Tecnologias',30,B('hisMenu()','História','Linha do tempo: ordem e duração',30)+B('mapMenu()','Geografia','Mapa do Brasil, leitura de mapas, geopolítica, urbanização e meio ambiente',30)+B('phMenu()','Filosofia','Arché, filósofos, escolas e áreas',30)+B('soMenu()','Sociologia','Autores, cultura, desigualdade e cidadania',30))+
  S(2,'Ciências da Natureza e suas Tecnologias',145,B('bioMenu()','Biologia','Célula, DNA, genética, ecologia, evolução e corpo humano',145)+B('quiMenu()','Química','Mol, pH, pilhas, química orgânica, tabela periódica e fórmulas',145)+B('fisMenu()','Física','Eletricidade, mecânica, termologia, ondas, hidrostática e fórmulas',145))+
  S(3,'Matemática e suas Tecnologias',215,B('menu()','Matemática','Tabuadas, unidades, fórmulas, estatística, funções, porcentagem, trigonometria e combinatória',215))+
  S(5,'Redação',350,B('rdMenu()','Redação','Monte estruturas e argumentos, peça por peça',350))+
  S(4,'Treino misto',270,B("vfFrom='h';vfMenu()",'Verdadeiro ou falso','Todas as áreas em uma só rodada',270));

function go(m){if(m==='tg')return tgMenu();if(m==='est')return estMenu();if(m==='fun')return funMenu();if(m==='pct')return pcMenu();if(m==='geo')return geoMenu();if(m==='vf'){vfFrom='m';return vfMenu()}if(m==='regras')return rulesMenu();if(m==='form'){fNat=false;return formMenu()}if(m==='corr')return startC();if(m==='unid')return unitsMenu();if(m==='clash')return startClash();if(m==='cores')return startCores();mode=m;tabs()}

function tabs(){
  clearInterval(tick);$('#ov').classList.remove('show');
  let h=`<div class="top"><button class="ib" onclick="menu()" aria-label="Voltar">←</button><div class="ttl">${mode==='lin'?'Em sequência':'Escolher tabuada'}</div></div><div class="grid">`;

function start(n){kind='tab';cur=n;bk=n;ttl='Tabuada do '+n;build([...Array(10)].map((_,i)=>({a:n,b:i+1,h:hue(n)})))}
function startClash(){
  kind='clash';bk='clash';
  const ts=rnd([3,4,5,6,7,8,9]).slice(0,3+ri(3)),used=new Set(),rows=[];
  const add=(a,b)=>{if(used.has(a*b))return false;used.add(a*b);rows.push({a,b,h:hue(a)});return true};
  ts.forEach(t=>{while(!add(t,1+ri(10)));});
  for(const [a,b] of rnd(ts.flatMap(t=>[...Array(10)].map((_,i)=>[t,i+1])))){if(rows.length>=10)break;add(a,b)}
  ttl='Clash '+ts.sort().join('·');build(rnd(rows));
}
function startCores(){
  kind='cores';bk='cores';ttl='Liga das cores';
  const hs=rnd([0,25,145,180,215,265,300,335]),used=new Set(),rows=[];
  while(rows.length<8){const a=3+ri(7),b=2+ri(9);if(used.has(a*b))continue;used.add(a*b);rows.push({a,b,h:hs[rows.length]})}
  build(rows);
}

v:{b:'metros cúbicos (m³)',suf:' cúbico',nb:['quilômetro','hectômetro','decâmetro','metro','decímetro','centímetro','milímetro'],eq:['1.000.000.000','1.000.000','1.000','1','0,001','0,000001','0,000000001']},

'Juros compostos':'A cada período o montante é multiplicado por (1 + i); em t períodos, vira a potência t.',

'Termo geral da PG':'Do 1º ao n-ésimo termo, multiplicou-se por q exatamente (n − 1) vezes.',

'Regra de 3 inversa':'Se uma grandeza sobe e a outra desce (como velocidade e tempo), o produto se mantém: a × b = c × x, e daí x = a × b ÷ c.',

const PFX=['quilo: 1.000 vezes a unidade base','hecto: 100 vezes a unidade base','deca: 10 vezes a unidade base','é a própria unidade base','deci: a décima parte da base','centi: a centésima parte da base','mili: a milésima parte da base'];
const CRW=['1 dam³ = 1.000 m³, e cada m³ tem 1.000 L','1 m³ = 1.000 dm³, e cada dm³ tem 1 L','Um cubo de 10 cm de aresta (1 dm³) comporta 1 L','1 cm³ é um cubinho de 1 cm de lado: cabe 1 mL','1 mm³ é a milésima parte de 1 cm³'];
const CRK=['1.000.000 L de água pesam 1.000.000 kg','1.000 L de água pesam 1.000 kg (1 tonelada)','1 L de água pesa 1 kg','1 mL de água pesa 1 g','0,001 mL de água pesa 0,001 g'];

function hint(){
  if(hintOpen)return;
  let intro='',rows='',hh=250;
  if(t0){clearInterval(tick);hintT=performance.now()}else hintT=0;
  if(kind==='tab'||kind==='clash'||kind==='cores'){
    hh=kind==='tab'?hue(cur):250;
    intro=`<b>Truque:</b> a × b = a × (b − 1) + a. Ou seja, parta do resultado anterior e some o número.`+(kind==='cores'?' A cor da conta é a mesma do resultado.':'');
    rows=curRows.slice().sort((x,y)=>x.a-y.a||x.b-y.b).map(r=>{const v=r.a*r.b;
      return hrow((kind==='cores'?`<i class="dot" style="background:hsl(${r.h} 62% 50%)"></i>`:'')+`${r.a} × ${r.b} = ${v}`,mulWhy(r.a,r.b),isOk('r',v))}).join('');
  }else if(kind==='unit'){
    const T=UT[uType],X=UX[uType],N=nmOf(uType),f=T.f;hh=T.h;
    const dim=f===100?' (em área, são 2 dimensões)':f===1000?' (em volume, são 3 dimensões)':'';
    if(placed<uN){
      intro=`<b>Ordem:</b> da maior para a menor unidade: quilo, hecto, deca, a base, deci, centi, mili. Cada passo para a direita é uma unidade menor.`;
      rows=T.u.map((u,i)=>hrow(u,PFX[i],isOk('u',u))).join('');
    }else if(placed<2*uN){
      intro=`<b>Os nomes</b> vêm dos prefixos, que dizem o tamanho de cada unidade em relação à base.`+(uType==='a'||uType==='v'?` Aqui vale o nome da unidade de comprimento, mais "${X.suf.trim()}".`:'');
      rows=T.u.map((u,i)=>hrow(`${u} = ${N[i]}`,PFX[i],isOk('n',N[i]))).join('');
    }else if(placed<3*uN){
      intro=`<b>Cada casa vale ${f.toLocaleString('pt-BR')} vezes a vizinha</b>${dim}. Por isso os valores crescem ou diminuem de ${f.toLocaleString('pt-BR')} em ${f.toLocaleString('pt-BR')}.`;
      rows=T.u.map((u,i)=>hrow(`1 ${u} = ${X.eq[i]} ${X.b}`,i<3?'Unidade maior que a base: vale mais que 1.':i===3?'É a própria unidade base: vale 1.':'Unidade menor que a base: vale menos que 1.',isOk('e',X.eq[i]))).join('');
    }else{
      const F=f.toLocaleString('pt-BR');
      intro=`<b>Cada casa muda o número por ${F}</b>${dim}.`;
      rows=hrow(`→ ×${F}`,'Indo para a direita a unidade fica menor, então cabem mais dela: multiplica.',isOk('o','×'+f))+hrow(`← ÷${F}`,'Indo para a esquerda a unidade fica maior, então precisa de menos: divide.',isOk('o','÷'+f));
    }
  }else if(kind==='corr'){
    if(placed<5){
      intro=`<b>Base:</b> 1 dm³ é um cubo de 10 cm de aresta, que comporta exatamente 1 litro. Cada degrau de volume muda por 1.000.`;
      rows=CR.map((r,i)=>hrow(`${r[0]} = ${r[1]}`,CRW[i],isOk('l',r[1]))).join('');
    }else{
      intro=`<b>Na água,</b> 1 L pesa 1 kg. Então o número é o mesmo do litro, só muda a unidade.`;
      rows=CR.map((r,i)=>hrow(`${r[0]} = ${r[2]}`,CRK[i],isOk('k',r[2]))).join('');
    }
  }else if(kind==='form'){
    const T=FM[fType];hh=T.h;
    if(fMode==='build'){
      const f=T.f[fIdx];
      if(fC&&placed<1){intro=`<b>${f[0]}:</b> o comando do enunciado aponta para esta ação.`;rows=hrow('“'+CM[f[0]][0]+'”',CM[f[0]][1],false)}
      else if(EXR[f[0]]&&placed>=fC+fTk+(SY[f[0]]||[]).length){intro=`<b>${f[0]}:</b> a resolução do exemplo, na ordem.`;rows=hrow(EXR[f[0]].q.join(' '),EXR[f[0]].p,false)}
      else if(placed>=fC+fTk&&SY[f[0]]){intro=`<b>${f[0]}:</b> o que cada letra significa.`;rows=SY[f[0]].map(x=>hrow(x[0],x[1],isOk('s',x[1]))).join('')}
      else{intro=`<b>${f[0]}:</b> monte as peças nesta ordem.`;rows=hrow(f[1],FW[f[0]]||'',false)}
    }else{
      intro=`<b>${T.n}:</b> entender de onde a fórmula vem ajuda a lembrar dela.`;
      rows=T.f.map(f=>hrow(`${f[1]}`,`<span style="color:var(--ink);font-weight:800">${f[0]}.</span> ${FW[f[0]]||''}`,isOk('f',f[1]))).join('');
    }
  }else if(kind==='rule'){
    const Q=RS[rIdx],bl=Q.b[rb];hh=Q.h;intro=bl.t;
    if(bl.r){
      rows=[...bl.r].map(c=>hrow(`${c} ${'AT'.includes(c)?'=':'≡'} ${CP[c]}`,`${c} pareia sempre com ${CP[c]}, com ${'AT'.includes(c)?'2':'3'} pontes de hidrogênio.`,false)).join('');
    }else{
      rows=(bl.x?bl.x.map(r=>hrow(r[0],r[1],false)).join(''):'')+hrow(bl.q.join(' '),'Monte as peças nesta ordem.',false);
    }
  }
  hintOpen=true;
  $('#box').style.setProperty('--h',hh);
  $('#box').innerHTML=`<div class="stars" style="letter-spacing:0">${bulb().replace('class="bulb"','class="bulb" style="width:38px;height:38px;margin:auto"')}</div><h2>Solução</h2><p class="hx">${intro}</p><div class="hl">${rows}</div><button class="btn" onclick="closeHint()">Entendi</button>`;
  $('#ov').classList.add('show');
}
function closeHint(){
  if(!hintOpen)return;hintOpen=false;$('#ov').classList.remove('show');
  if(hintT){t0+=performance.now()-hintT;tick=setInterval(upd,100)}
}
$('#ov').addEventListener('click',e=>{if(e.target===e.currentTarget)closeHint()});

  const e=performance.now()-t0,el=$('#tm');if(!el)return;el.textContent=fmt(e);
  const b=store.best[bk];el.className='tm';
  if(b&&placed>0)el.classList.add(e/placed*total<=b?'g':'o');
}

function molSVG(m){
  if(m.ring){const P=[0,1,2,3,4,5].map(k=>[50+30*Math.cos((k*60-90)*Math.PI/180),50+30*Math.sin((k*60-90)*Math.PI/180)]);let d='';
    for(let k=0;k<6;k++){const a=P[k],b=P[(k+1)%6];d+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
      if(m.ring==='b'&&k%2===0){const f=(p,q)=>[p[0]+(50-p[0])*.17+(q[0]-p[0])*.14,p[1]+(50-p[1])*.17+(q[1]-p[1])*.14],g=(p,q)=>[q[0]+(50-q[0])*.17+(p[0]-q[0])*.14,q[1]+(50-q[1])*.17+(p[1]-q[1])*.14],u=f(a,b),v=g(a,b);d+=`<line x1="${u[0]}" y1="${u[1]}" x2="${v[0]}" y2="${v[1]}"/>`}}
    return `<svg viewBox="0 0 100 100" class="mol">${d}</svg>`}
  const n=m.n,X=i=>26+i*34,Y=i=>i%2?34:58,A=[],Bn=[];
  for(let i=0;i<n;i++)A.push({x:X(i),y:Y(i)});
  for(let i=0;i<n-1;i++)Bn.push([i,i+1,m.b[i]]);
  const br=i=>Y(i)>46?84:8,add=(x,y,l)=>{A.push({x,y,l});return A.length-1};
  if(['OH','NH₂','Cl'].includes(m.g))Bn.push([n-1,add(X(n),Y(n),m.g),1]);
  if(m.g==='CHO')Bn.push([n-1,add(X(n-1),br(n-1),'O'),2]);
  if(m.g==='CETONA')Bn.push([1,add(X(1),br(1),'O'),2]);
  if(m.g==='COOH'){Bn.push([n-1,add(X(n-1),br(n-1),'O'),2]);Bn.push([n-1,add(X(n),Y(n),'OH'),1])}
  const W=26*2+(n+(m.g==='OH'||m.g==='NH₂'||m.g==='Cl'||m.g==='COOH'?1:0))*34;let d='';
  Bn.forEach(([a,b,o])=>{const p=A[a],q=A[b],dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,offs=o===1?[0]:o===2?[-2.8,2.8]:[-4.5,0,4.5];
    offs.forEach(k=>d+=`<line x1="${p.x+nx*k}" y1="${p.y+ny*k}" x2="${q.x+nx*k}" y2="${q.y+ny*k}"/>`)});
  A.forEach(a=>{if(a.l)d+=`<circle cx="${a.x}" cy="${a.y}" r="${a.l.length>1?13:9}" class="mb"/><text x="${a.x}" y="${a.y}">${a.l}</text>`});
  return `<svg viewBox="0 0 ${W} 92" class="mol">${d}</svg>`;
}

const srt=a=>a.slice().sort((x,y)=>x-y),sm=a=>a.reduce((x,y)=>x+y,0),avg=a=>sm(a)/a.length;
const med=a=>{const s=srt(a),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};
const mo=a=>{const c={};a.forEach(x=>c[x]=(c[x]||0)+1);const m=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]===m).map(Number)};
const dsx=n=>Array.from({length:n},()=>1+ri(12));
const ESF=[['Um valor extremo muito grande altera bastante a média',true,'A média soma todos os valores, então um extremo a puxa.'],['Um valor extremo muito grande altera bastante a mediana',false,'A mediana depende da posição central e resiste a extremos.'],['Um conjunto pode ter mais de uma moda',true,'Se dois valores empatam como mais frequentes, são duas modas.'],['A moda é sempre o maior valor do conjunto',false,'A moda é o valor que mais se repete, seja grande ou pequeno.'],['Com quantidade par de dados, a mediana é sempre um valor da lista',false,'É a média dos dois centrais: de 2 e 5 sai 3,5, que não está na lista.'],['A média aritmética é sempre um dos valores da lista',false,'A média de 2 e 5 é 3,5.'],['Somar 10 a todos os valores soma 10 à média',true,'Todos andam 10, então a média também.'],['Multiplicar todos os valores por 2 dobra a mediana',true,'A ordem se mantém e o termo central dobra.'],['Na média ponderada, todos os valores têm o mesmo peso',false,'É a aritmética que tem pesos iguais.'],['Se todos os valores são iguais, média, moda e mediana coincidem',true,'Não há variação: as três valem o mesmo número.']];
const vfE=()=>{const R=[];for(let i=0;i<10;i++){const t=Math.random()<.5,k=i%5;let a;
  if(k===0){a=dsx(4);a[3]+=(4-sm(a)%4)%4;const m=avg(a);R.push({c:'Média aritmética',q:'Este valor está certo?',s:`Dados: ${a.join(', ')}. Média = ${nf(t?m:m+PK([-2,-1,1,2]))}`,v:t,w:`Soma ${sm(a)} ÷ 4 valores = ${nf(m)}.`})}
  else if(k===1){do a=dsx(5);while(a[2]===med(a));const m=med(a);R.push({c:'Mediana: ordenar primeiro',q:'Este valor está certo?',s:`Dados: ${a.join(', ')}. Mediana = ${t?m:a[2]}`,v:t,w:`Ordenando: ${srt(a).join(', ')}. O termo central é ${m}. O do meio da lista desordenada (${a[2]}) engana.`})}
  else if(k===2){do a=dsx(4);while(srt(a)[1]===srt(a)[2]);const s=srt(a),m=med(a);R.push({c:'Mediana com quantidade par',q:'Este valor está certo?',s:`Dados: ${a.join(', ')}. Mediana = ${nf(t?m:s[1])}`,v:t,w:`Ordenando: ${s.join(', ')}. É a média dos centrais: (${s[1]} + ${s[2]}) ÷ 2 = ${nf(m)}.`})}
  else if(k===3){do a=dsx(7);while(mo(a).length>1||a.filter(x=>x===mo(a)[0]).length<2);const m=mo(a)[0],o=PK(a.filter(x=>x!==m));R.push({c:'Moda',q:'Este valor está certo?',s:`Dados: ${a.join(', ')}. Moda = ${t?m:o}`,v:t,w:`O ${m} aparece ${a.filter(x=>x===m).length} vezes, mais que os outros.`})}

const bars=(l,v)=>{const M=Math.max(...v);return `<div style="font-size:15px;text-align:left;font-weight:700;display:grid;gap:4px">`+l.map((x,i)=>`<div style="display:flex;align-items:center;gap:8px"><span style="width:44px">${x}</span><span style="flex:1;background:var(--line);border-radius:6px;height:14px"><i style="display:block;height:14px;border-radius:6px;background:hsl(215 62% 50%);width:${v[i]/M*100}%"></i></span><span style="width:34px;text-align:right">${v[i]}</span></div>`).join('')+'</div>'};

  else if(k===2){const a=PK([-3,-2,-1,1,2,3]),b=ri(7)-3,c=ri(7)-3,up=a>0;R.push({c:'Concavidade da parábola',q:'Esta afirmação está certa?',s:`f(x) = ${a}x² ${sg(b)}x ${sg(c)}: concavidade para ${(t?up:!up)?'cima':'baixo'}`,v:t,w:`Só o sinal de a conta: a ${up?'> 0, para cima':'< 0, para baixo'}.`})}

  else{const d=PK(DP);R.push({c:'Grandezas proporcionais',q:'Esta classificação está certa?',s:`${d[0]} são grandezas ${(t?d[1]:!d[1])?'diretamente':'inversamente'} proporcionais`,v:t,w:`${d[0]}: ${d[1]?'se uma dobra, a outra dobra (direta)':'se uma dobra, a outra cai pela metade (inversa)'}.`})}}
  return R};

R('Energia potencial elástica','Ee = k × x² ÷ 2','Mola mais dura e mais deformada guarda mais energia; x entra ao quadrado.','Ee|energia elástica;k|constante da mola;x²|deformação ao quadrado','Energia guardada numa mola esticada ou comprimida','Multiplicar k pelo quadrado da deformação e dividir por 2','k = 100 e x = 0,2 m. Qual é Ee?@100 × 0,2² ÷ 2 = 100 × 0,04 ÷ 2 = 4 ÷ 2 = 2@0,4'),
R('Rendimento','η = Pútil ÷ Ptotal','Mostra quanto do que entrou virou algo útil. Fica entre 0 e 1 (ou 0% e 100%).','η|rendimento;Pútil|potência (ou energia) aproveitada;Ptotal|potência (ou energia) total recebida','Qual é o rendimento da máquina ou do aparelho?','Dividir o que foi aproveitado pelo total recebido','Recebe 500 W e aproveita 400 W. Qual é o rendimento?@400 ÷ 500 = 0,8@0,2')]);
add('fc','Física: Fluidos e calor','Pressão, empuxo, temperatura e gases',8,[
R('Teorema de Stevin','p = p₀ + d × g × h','A pressão aumenta com a profundidade: soma a da superfície com a do líquido.','p|pressão no fundo;p₀|pressão na superfície;d|densidade do líquido;g|aceleração da gravidade;h|profundidade','Pressão a certa profundidade num líquido','Somar à pressão da superfície o valor de d × g × h','p₀ = 100000, d = 1000, g = 10 e h = 2. Qual é p?@100000 + 1000 × 10 × 2 = 100000 + 20000 = 120000@0,6'),
R('Empuxo','E = d × V × g','Arquimedes: o empuxo é o peso do líquido que o corpo desloca.','E|empuxo;d|densidade do líquido;V|volume submerso;g|aceleração da gravidade','Força para cima que o líquido faz no corpo','Multiplicar densidade do líquido, volume submerso e gravidade','d = 1000, V = 0,002 e g = 10. Qual é o empuxo?@1000 × 0,002 × 10 = 2 × 10 = 20@0,4'),
R('Prensa hidráulica','F₁ ÷ A₁ = F₂ ÷ A₂','A pressão é a mesma nos dois êmbolos: no êmbolo de área maior a força é maior.','F₁|força no êmbolo 1;A₁|área do êmbolo 1;F₂|força no êmbolo 2;A₂|área do êmbolo 2','Uma força pequena levanta uma carga grande (macaco hidráulico)','Igualar as pressões: força ÷ área nos dois êmbolos','Êmbolo 1: F = 30 e A = 2. Êmbolo 2: A = 10. Qual é a força F₂?@30 × 10 ÷ 2 = 300 ÷ 2 = 150@0,4'),
R('Vazão','Q = V ÷ Δt','Volume que passa por unidade de tempo.','Q|vazão;V|volume;Δt|tempo','Quantos litros por minuto passam pela torneira?','Dividir o volume pelo tempo','Uma caixa enche 60 L em 5 min. Qual é a vazão?@60 ÷ 5 = 12@0,2'),
R('Calor latente','Q = m × L','Na mudança de estado a temperatura não muda: o calor todo vai para trocar o estado.','Q|calor;m|massa;L|calor latente (fusão, vaporização...)','Calor para derreter ou ferver sem mudar a temperatura','Multiplicar a massa pelo calor latente','m = 2 kg e L = 80. Qual é o calor?@2 × 80 = 160@0,2'),
R('Celsius para Kelvin','T = θ + 273','As duas escalas têm o mesmo tamanho de grau; o zero do kelvin fica 273 abaixo.','T|temperatura em kelvin;θ|temperatura em °C;273|diferença entre as escalas','Passe uma temperatura de °C para K','Somar 273 ao valor em °C','27 °C valem quantos kelvin?@27 + 273 = 300@0,2'),
R('Celsius e Fahrenheit','C ÷ 5 = ( F − 32 ) ÷ 9'.replace(/ /g,' ').replace('( F − 32 )','(F − 32)'),'As escalas se igualam por proporção: o intervalo entre fusão e ebulição da água vale 100 em °C e 180 em °F.','C|temperatura em °C;F|temperatura em °F','Converta °C em °F (ou o contrário)','Igualar C ÷ 5 com (F − 32) ÷ 9','Água ferve a 100 °C. Quanto é em °F?@100 ÷ 5 = 20 → 20 × 9 + 32 = 212@6,10'),
R('Dilatação linear','ΔL = L₀ × α × ΔT','Barra maior, material que dilata mais (α) e aquecimento maior: aumenta mais.','ΔL|quanto o comprimento aumentou;L₀|comprimento inicial;α|coeficiente de dilatação linear;ΔT|variação de temperatura','Quanto um trilho ou barra aumenta com o calor?','Multiplicar comprimento inicial, α e variação de temperatura','L₀ = 100, α = 0,00001 e ΔT = 50. Qual é ΔL?@100 × 0,00001 × 50 = 0,001 × 50 = 0,05@0,4'),
R('Rendimento de Carnot','η = 1 − Tfria ÷ Tquente','Nenhuma máquina térmica rende 100%: o máximo depende só das temperaturas (em kelvin).','η|rendimento máximo;Tfria|temperatura da fonte fria (K);Tquente|temperatura da fonte quente (K)','Rendimento máximo de uma máquina térmica','Fazer 1 menos a razão entre a temperatura fria e a quente (em kelvin)','Tfria = 300 K e Tquente = 600 K. Qual é o rendimento máximo?@1 − 300 ÷ 600 = 1 − 0,5 = 0,5@0,4')]);
add('fe','Física: Ondas e eletricidade','Ondas, luz, circuitos e transformador',35,[
R('Equação fundamental da onda','v = λ × f','Cada onda tem comprimento λ e passam f ondas por segundo: a velocidade é λ × f.','v|velocidade da onda;λ|comprimento de onda;f|frequência','Velocidade de uma onda (som, luz, corda)','Multiplicar o comprimento de onda pela frequência','λ = 2 m e f = 170 Hz. Qual é a velocidade?@2 × 170 = 340@0,2'),
R('Frequência e período','f = 1 ÷ T','Período é o tempo de uma oscilação; frequência é quantas cabem em 1 segundo.','f|frequência (Hz);T|período (s)','Quantas oscilações por segundo?','Dividir 1 pelo período','T = 0,5 s. Qual é a frequência?@1 ÷ 0,5 = 2@0,2'),
R('Índice de refração','n = c ÷ v','Compara a velocidade da luz no vácuo com a do meio; n nunca é menor que 1.','n|índice de refração;c|velocidade da luz no vácuo;v|velocidade da luz no meio','Quanto a luz é freada num material?','Dividir a velocidade da luz no vácuo pela velocidade no meio','c = 300000 km/s e v = 200000 km/s. Qual é n?@300000 ÷ 200000 = 1,5@0,2'),
R('Lei de Snell','n₁ × sen θ₁ = n₂ × sen θ₂','Na refração, n × sen θ é igual nos dois meios: por isso a luz desvia.','n₁|índice do meio 1;θ₁|ângulo de incidência;n₂|índice do meio 2;θ₂|ângulo de refração','A luz passa de um meio para outro e desvia','Igualar n × sen θ nos dois meios'),
R('Equação de Gauss','1 ÷ f = 1 ÷ p + 1 ÷ p′','Dá a posição da imagem em lentes e espelhos esféricos.','f|distância focal;p|distância do objeto;p′|distância da imagem','Onde se forma a imagem numa lente ou espelho?','Somar os inversos das distâncias do objeto e da imagem'),
R('Corrente elétrica','i = Q ÷ Δt','Corrente é a quantidade de carga que passa por segundo.','i|corrente (A);Q|carga elétrica (C);Δt|tempo (s)','Quantos coulombs passam por segundo?','Dividir a carga pelo tempo','Passam 60 C em 20 s. Qual é a corrente?@60 ÷ 20 = 3@0,2'),
R('Resistores em série','Req = R₁ + R₂','Na mesma fila, a corrente passa por um resistor depois do outro: as resistências somam.','Req|resistência equivalente;R₁|resistência 1;R₂|resistência 2','Resistores ligados um após o outro','Somar as resistências','R₁ = 4 Ω e R₂ = 6 Ω. Qual é Req?@4 + 6 = 10@0,2'),
R('Resistores em paralelo','Req = R₁ × R₂ ÷ (R₁ + R₂)','Cada ramo é um caminho a mais: Req fica menor que a menor resistência. Esta forma vale para 2 resistores.','Req|resistência equivalente;R₁|resistência 1;R₂|resistência 2','Dois resistores em ramos separados (paralelo)','Multiplicar as resistências e dividir pela soma delas','R₁ = 6 Ω e R₂ = 3 Ω. Qual é Req?@6 × 3 ÷ ( 6 + 3 ) = 18 ÷ 9 = 2@0,8'),
R('Potência pela corrente','P = R × i²','É o efeito Joule: a energia que vira calor num resistor.','P|potência dissipada;R|resistência;i²|corrente ao quadrado','Potência num resistor, sabendo R e i','Multiplicar a resistência pelo quadrado da corrente','R = 5 Ω e i = 2 A. Qual é P?@5 × 2² = 5 × 4 = 20@0,2'),
R('Potência pela tensão','P = U² ÷ R','Útil em chuveiro, lâmpada e ferro: se sabe a tensão da rede e a resistência.','P|potência;U²|tensão ao quadrado;R|resistência','Potência de um aparelho ligado numa tensão','Elevar a tensão ao quadrado e dividir pela resistência','U = 120 V e R = 24 Ω. Qual é P?@120² ÷ 24 = 14400 ÷ 24 = 600@0,2'),
R('2ª Lei de Ohm','R = ρ × L ÷ A','Fio mais longo ou mais fino resiste mais; ρ depende do material.','R|resistência do fio;ρ|resistividade do material;L|comprimento do fio;A|área da seção do fio','Resistência de um fio condutor','Multiplicar a resistividade pelo comprimento e dividir pela área','ρ = 2, L = 10 e A = 4. Qual é R?@2 × 10 ÷ 4 = 20 ÷ 4 = 5@0,4'),
R('Transformador','Up ÷ Us = Np ÷ Ns','A tensão varia na mesma proporção que o número de espiras (voltas) das bobinas.','Up|tensão no primário (entrada);Us|tensão no secundário (saída);Np|espiras do primário;Ns|espiras do secundário','Um transformador abaixa ou eleva a tensão','Igualar a razão das tensões com a razão das espiras','Up = 120 V, Np = 200 e Ns = 100. Qual é Us?@120 × 100 ÷ 200 = 12000 ÷ 200 = 60@0,4'),
R('Lei de Coulomb','F = k × Q₁ × Q₂ ÷ d²','A força entre cargas cresce com as cargas e cai com o quadrado da distância.','F|força elétrica;k|constante eletrostática;Q₁|carga 1;Q₂|carga 2;d²|distância ao quadrado','Força entre duas cargas elétricas','Multiplicar k pelas cargas e dividir pelo quadrado da distância','k = 9, Q₁ = 2, Q₂ = 3 e d = 3. Qual é F?@9 × 2 × 3 ÷ 3² = 54 ÷ 9 = 6@0,6')]);
add('qa','Química: Soluções e quantidades','Mol, concentração, diluição, pH',145,[
R('Número de mols','n = m ÷ MM','Massa molar (MM) é a massa de 1 mol; dividir a massa por ela conta quantos mols há.','n|número de mols;m|massa da amostra (g);MM|massa molar (g/mol)','Quantos mols há em tantos gramas?','Dividir a massa pela massa molar','A água tem MM = 18 g/mol. Quantos mols há em 36 g?@36 ÷ 18 = 2@0,2'),
R('Número de partículas','N = n × 6,02 × 10²³','Constante de Avogadro: 1 mol tem 6,02 × 10²³ partículas.','N|número de partículas;n|número de mols;6,02 × 10²³|partículas em 1 mol','Quantas moléculas existem em tantos mols?','Multiplicar o número de mols pela constante de Avogadro'),
R('Concentração comum','C = m₁ ÷ V','Massa de soluto em cada litro de solução (g/L).','C|concentração (g/L);m₁|massa do soluto (g);V|volume da solução (L)','Quantos gramas de soluto por litro?','Dividir a massa do soluto pelo volume da solução','40 g de sal em 2 L de solução. Qual é C?@40 ÷ 2 = 20@0,2'),
R('Molaridade','M = n ÷ V','Mols de soluto por litro de solução. Se só tem a massa, use antes n = m ÷ MM.','M|molaridade (mol/L);n|mols do soluto;V|volume da solução (L)','Quantos mols de soluto por litro de solução?','Dividir o número de mols pelo volume em litros','3 mols em 1,5 L de solução. Qual é M?@3 ÷ 1,5 = 2@0,2'),
R('Diluição','C₁ × V₁ = C₂ × V₂','Água não tem soluto: a quantidade de soluto antes e depois é a mesma, então C × V não muda.','C₁|concentração inicial;V₁|volume inicial;C₂|concentração final;V₂|volume final','Adicionou água e a solução ficou mais fraca','Igualar C × V antes e depois da diluição','C₁ = 2 mol/L, V₁ = 100 mL e V₂ = 400 mL. Qual é C₂?@2 × 100 ÷ 400 = 200 ÷ 400 = 0,5@0,4'),
R('Título','τ = m₁ ÷ m','Fração da solução que é soluto; vezes 100 dá a porcentagem em massa.','τ|título (sem unidade);m₁|massa do soluto;m|massa da solução (soluto + solvente)','Qual a porcentagem de soluto na solução?','Dividir a massa do soluto pela massa da solução','20 g de sal numa solução de 100 g. Qual é o título?@20 ÷ 100 = 0,2@0,2'),
R('Partes por milhão (ppm)','ppm = mg ÷ kg','Em água, 1 L pesa cerca de 1 kg: ppm é quase o mesmo que mg por litro.','ppm|partes por milhão;mg|massa do soluto em mg;kg|massa da solução em kg','Quantos mg de poluente por kg de solução?','Dividir os miligramas de soluto pelos quilos de solução','6 mg de poluente em 2 kg de solução. Quantos ppm?@6 ÷ 2 = 3@0,2'),
R('pH','pH = − log [H⁺]','Escala logarítmica: cada unidade de pH muda a acidez 10 vezes. Abaixo de 7 é ácido, 7 neutro e acima de 7 básico.','pH|medida da acidez;log|logaritmo de base 10;[H⁺]|concentração de íons H⁺ (mol/L)','Qual é o pH da solução?','Tirar o log da [H⁺] e trocar o sinal','Se [H⁺] = 10⁻³ mol/L, qual é o pH?@− log 10⁻³ = − ( −3 ) = 3'),
R('pH + pOH','pH + pOH = 14','A 25 °C, pH e pOH sempre somam 14.','pH|medida da acidez;pOH|medida da basicidade','Sabe o pOH e quer o pH (ou o contrário)','Somar pH e pOH dá 14','pOH = 4. Qual é o pH?@14 − 4 = 10@0,2')]);
add('qb','Química: Reações, gases e energia','Rendimento, gases, entalpia, pilhas',165,[
R('Rendimento da reação','R% = real ÷ teórico × 100','Na prática quase nunca se obtém tudo o que a conta prevê: o rendimento compara o obtido com o esperado.','R%|rendimento percentual;real|quantidade obtida de fato;teórico|quantidade prevista pela equação','A reação deveria dar 50 g, mas deu 40 g','Dividir o obtido pelo previsto e multiplicar por 100','Previsto 50 g, obtido 40 g. Qual é o rendimento?@40 ÷ 50 × 100 = 0,8 × 100 = 80@0,4'),
R('Pureza','P% = mpura ÷ mtotal × 100','Só a parte pura reage; as impurezas ficam de fora da conta.','P%|pureza percentual;mpura|massa da substância pura;mtotal|massa total da amostra','Minério ou amostra com certa porcentagem de pureza','Dividir a massa pura pela total e multiplicar por 100','60 g puros numa amostra de 80 g. Qual é a pureza?@60 ÷ 80 × 100 = 75@0,4'),
R('Equação de Clapeyron','p × V = n × R × T','Relaciona as quatro variáveis do gás ideal. A temperatura precisa estar em kelvin (°C + 273).','p|pressão do gás;V|volume do gás;n|número de mols;R|constante dos gases;T|temperatura em kelvin','Pressão, volume, mols e temperatura de um gás','Igualar p × V a n × R × T, com T em kelvin','n = 2 mol, R = 0,08, T = 300 K e V = 24 L. Qual é p (atm)?@2 × 0,08 × 300 ÷ 24 = 48 ÷ 24 = 2@0,6'),
R('Lei geral dos gases','p₁ × V₁ ÷ T₁ = p₂ × V₂ ÷ T₂','Com a mesma quantidade de gás, p × V ÷ T fica igual antes e depois (T em kelvin).','p₁|pressão inicial;V₁|volume inicial;T₁|temperatura inicial (K);p₂|pressão final;V₂|volume final;T₂|temperatura final (K)','O gás muda de pressão, volume ou temperatura','Igualar p × V ÷ T no estado inicial e no final'),
R('Variação de entalpia','ΔH = Hprodutos − Hreagentes','ΔH negativo: a reação libera calor (exotérmica). ΔH positivo: absorve calor (endotérmica).','ΔH|variação de entalpia (calor da reação);Hprodutos|entalpia dos produtos;Hreagentes|entalpia dos reagentes','A reação é exotérmica ou endotérmica? Quanto calor troca?','Subtrair a entalpia dos reagentes da dos produtos','Hprodutos = −300 e Hreagentes = −100 kJ. Qual é ΔH?@−300 − ( −100 ) = −200@0,4'),
R('Equilíbrio químico (Kc)','Kc = [produtos] ÷ [reagentes]','Versão simplificada: cada concentração é elevada ao seu coeficiente. Kc grande favorece os produtos.','Kc|constante de equilíbrio;[produtos]|concentração dos produtos (mol/L);[reagentes]|concentração dos reagentes (mol/L)','Qual é a constante de equilíbrio da reação?','Dividir a concentração dos produtos pela dos reagentes','Produtos 0,6 e reagentes 0,3. Qual é Kc?@0,6 ÷ 0,3 = 2@0,2'),
R('Pilhas: ΔE','ΔE = Emaior − Emenor','O eletrodo de maior potencial de redução ganha elétrons (cátodo); o outro perde (ânodo).','ΔE|voltagem (ddp) da pilha;Emaior|maior potencial de redução (cátodo);Emenor|menor potencial de redução (ânodo)','Qual é a voltagem (ddp) da pilha?','Subtrair o menor potencial de redução do maior','Cu: +0,34 V e Zn: −0,76 V. Qual é a ddp?@0,34 − ( −0,76 ) = 0,34 + 0,76 = 1,1@0,4'),
R('Meia-vida','m = m₀ ÷ 2^x','A cada meia-vida a massa cai pela metade; depois de x meias-vidas, divide por 2 x vezes.','m|massa que restou;m₀|massa inicial;x|número de meias-vidas','Quanto sobra de uma amostra radioativa?','Dividir a massa inicial por 2 elevado ao número de meias-vidas','m₀ = 80 g e x = 3 meias-vidas. Quanto resta?@80 ÷ 2³ = 80 ÷ 8 = 10@0,2'),
R('Número de meias-vidas','x = t ÷ P','Conta quantas meias-vidas cabem no tempo que passou.','x|número de meias-vidas;t|tempo total;P|tempo de meia-vida','Quantas meias-vidas se passaram?','Dividir o tempo total pelo tempo de meia-vida','Passaram 30 anos e P = 10 anos. Qual é x?@30 ÷ 10 = 3@0,2'),
R('Número de massa','A = Z + N','O número de massa conta as partículas do núcleo: prótons mais nêutrons.','A|número de massa;Z|número atômico (prótons);N|número de nêutrons','Qual é o número de massa (ou quantos nêutrons)?','Somar prótons e nêutrons','Z = 11 e N = 12. Qual é A?@11 + 12 = 23@0,2')]);

const TIPS=[
{n:'Linguagens, Códigos e suas Tecnologias',h:330,t:[
['Leia o texto antes das alternativas','A resposta quase sempre está no texto-base, não no que você já sabia. Sublinhe a ideia central.'],
['Cuidado com “exceto”, “não” e “incorreta”','Marque essas palavras ao ler a pergunta: errar o comando é a pegadinha mais comum.'],
['Alternativas com “sempre”, “nunca” e “apenas”','Costumam ser exageros. A certa geralmente é mais cuidadosa e equilibrada.'],
['Artes: contexto vale mais que decoreba','Ligue obra, época e movimento (guerras e industrialização → vanguardas; Semana de 22 → Modernismo). Só decorar nomes não basta.'],
['Língua estrangeira: ache o assunto, não traduza tudo','Procure cognatos e o tema do texto. Cuidado com falsos cognatos (em inglês, “actually” é “na verdade”).'],
['Redação: proposta de intervenção completa','Inclua agente, ação, meio, finalidade e detalhamento, respeitando os direitos humanos. Fugir do tema zera a nota.']]},
{n:'Ciências Humanas e suas Tecnologias',h:30,t:[
['Leia título, fonte, data e legenda','Em charge, mapa, gráfico ou foto, esses detalhes entregam o contexto e quase sempre mudam a resposta.'],
['História: situe no tempo','Use ordem e duração. Cuidado com anacronismo: aplicar ideias de hoje a uma época antiga.'],
['“Segundo o texto” é só o texto','Uma alternativa pode ser verdadeira no mundo real e mesmo assim errada, porque não está no texto.'],
['Filosofia: uma frase por filósofo','Resuma a ideia central de cada um e treine aplicá-la a uma situação atual, que é como o Enem cobra.'],
['Geografia: unidade e escala','Densidade demográfica = população ÷ área. Confira km², escala do mapa e se o dado é absoluto ou percentual.'],
['Sociologia: conceitos no dia a dia','Cultura, desigualdade, cidadania e trabalho aparecem em situações cotidianas. Troque o nome técnico por um exemplo.']]},
{n:'Ciências da Natureza e suas Tecnologias',h:145,t:[
['Converta as unidades antes de calcular','km/h para m/s (÷ 3,6), g para kg, mL para L, minutos para horas. Muita conta certa vira resposta errada por unidade.'],
['Leia gráficos e tabelas primeiro','Muitas questões trazem os dados ou a própria fórmula. O trabalho é interpretar, não decorar.'],
['Elimine pela ordem de grandeza','Se uma alternativa dá um valor absurdo (um carro a 3000 m/s), descarte sem calcular.'],
['Direto ou inverso?','“Proporcional” e “inversamente proporcional” mudam a conta. Decida isso antes de montar a equação.'],
['Física: eletricidade, calor e ondas caem muito','Potência, energia em kWh, calor sensível e onda são campeões. Cheque se o tempo está em horas ou segundos.'],
['Química: mol, soluções, pH e orgânica','Estequiometria, concentração, pH, funções orgânicas, termoquímica e pilhas se repetem. A massa molar costuma vir no enunciado.'],
['Tabela periódica: setas, não decoreba','Em geral a questão dá os dados de que precisa. O que cai é interpretar tendências: raio, eletronegatividade e ionização, e a ligação que isso indica.'],
['Biologia: contexto de saúde e ambiente','Ecologia, genética e fisiologia vêm ligadas a situações reais. Relacione o conceito ao problema descrito.']]},
{n:'Matemática e suas Tecnologias',h:215,t:[
['Comece pela pergunta final','Descubra o que pedem (valor, porcentagem, quantidade) antes de ler os dados. Assim você filtra o que importa.'],
['Enunciado longo tem informação sobrando','Separe os dados úteis e ignore o resto. Anote os números com a unidade.'],
['Porcentagens não somam','Dois aumentos de 10% dão × 1,10 × 1,10 = × 1,21, ou seja, 21%. Use o fator multiplicador.'],

/* Passo a passo das fórmulas */
function passos(k,i){
  clearInterval(tick);$('#ov').classList.remove('show');kind='form';fType=k;fMode='menu';
  const T=FM[k],f=T.f[i],n=f[0],c=CM[n],S=SY[n]||[],e=EXR[n],st=[];
  if(c)st.push(['Reconheça o que o enunciado pede','Quando o texto diz “'+c[0]+'”, a ação é: '+c[1].toLowerCase()+'.','O enunciado quase nunca cita a fórmula: ele descreve uma situação. Ligar o comando à ação é o que diz qual relação usar e evita pegar a fórmula errada.']);
  st.push(['Escreva a fórmula','<b>'+f[1]+'</b>',FW[n]||'Toda fórmula resume uma relação entre grandezas.']);
  if(S.length)st.push(['Dê nome a cada letra',S.map(x=>'<b>'+x[0]+'</b> = '+x[1]).join('<br>'),'Cada letra é uma grandeza. Saber o que ela representa evita trocar um dado pelo outro na hora de substituir.']);
  st.push(['Separe os dados e confira as unidades','Anote o valor de cada letra que o texto dá. A letra que não tem valor é a incógnita. Converta tudo para unidades que combinam.','A fórmula só funciona com unidades compatíveis (km/h junto com segundos dá resposta errada). E a incógnita é justamente o que falta descobrir.']);
  if(e)st.push(['Substitua e calcule',e.p+'<br><b>'+e.q.join(' ')+'</b>','Troque as letras pelos números antes de calcular e resolva na ordem: parênteses, potências, × e ÷, depois + e −. Assim cada passo fica fácil de conferir.']);
  st.push(['Confira se o resultado faz sentido','Veja o valor e a unidade da resposta: eles são possíveis na situação do enunciado?','Erro de conta ou de unidade costuma gerar valores absurdos, e o Enem usa esses valores como alternativas erradas.']);
  $('#app').innerHTML=`<div class="top"><button class="ib" onclick="fSection('${k}')" aria-label="Voltar">←</button><div class="ttl">📖 Passo a passo</div></div><div class="ar" style="--h:${T.h};margin-top:4px">${n}</div>`
  +st.map((x,j)=>`<div class="dc" style="--h:${T.h}"><b>${j+1}. ${x[0]}</b><p><strong>O que fazer:</strong> ${x[1]}</p><p><strong>Por quê:</strong> ${x[2]}</p></div>`).join('')
  +(DET[n]?`<p class="sub" style="margin:22px 0 8px;font-weight:800">🔎 Passo a passo detalhado, para esta fórmula difícil</p>`+DET[n].map((x,j)=>`<div class="dc" style="--h:${T.h}"><b>${j+1}. ${x[0]}</b><p><strong>O que fazer:</strong> ${x[1]}</p><p><strong>Por quê:</strong> ${x[2]}</p></div>`).join(''):'')
  +`<button class="m" style="--h:${T.h};margin-top:18px" onclick="startB('${k}',${i})"><b>Montar esta fórmula</b><small>Agora é com você: monte peça por peça</small></button>`;
  window.scrollTo(0,0);
}

['Atenção ao sinal da aceleração','Freando, a é negativo (por exemplo a = −2).','A aceleração contra o movimento reduz v². Com o sinal errado, a velocidade final sairia maior que a inicial.'],

['Exemplo: parte do repouso','S₀ = 5, v₀ = 0, a = 2, t = 4. Então S = 5 + 0 + 2 × 16 ÷ 2 = 5 + 16 = <b>21</b>.','“Parte do repouso” significa v₀ = 0, o que zera um termo. É muito comum no Enem.'],

function pairWhy(q,s,tok){
  const Q=x=>`“${x}”`,sl=[...s.parentElement.children].filter(x=>!x.classList.contains('pbk')),k=sl.indexOf(s),rg=stgRanges(q),RL=['=','→','↔'];
  const rng=i=>rg.find(r=>i>=r[0]&&i<r[1])||[0,q.length];
  const rel=r=>{for(let i=r[0];i<r[1];i++)if(RL.includes(q[i]))return i;return -1};
  const L=r=>{const e=rel(r);return q.slice(r[0],e<0?r[1]:e).join(' ')},R=r=>{const e=rel(r);return e<0?'':q.slice(e+1,r[1]).join(' ')};
  const side=i=>{const e=rel(rng(i));return e<0?'-':i<e?'L':i>e?'R':'='};
  const cand=q.map((v,i)=>v===tok&&!(sl[i]&&sl[i].classList.contains('ok'))?i:-1).filter(i=>i>=0),j=cand.find(i=>rng(i)[0]!==rng(k)[0]),jj=j!==undefined?j:cand[0];
  const rk=rng(k),sk=side(k),sj=jj===undefined?'-':side(jj),rj=jj===undefined?rk:rng(jj);
  if(RL.includes(tok)&&sk!=='=')return `${Q(tok)} é o sinal que liga o item à sua descrição. Aqui vai uma peça de conteúdo.`;
  if(sk==='=')return `Aqui vai o sinal que liga ${Q(L(rk))} à sua descrição. ${Q(tok)} não é um sinal.`;
  if(sk!=='-'&&sj!=='-'&&sk!==sj)return sj==='L'?`${Q(tok)} é o item que está sendo descrito. Neste espaço vai a descrição de ${Q(L(rk))}.`:`${Q(tok)} é uma descrição. Neste espaço vai o item que é descrito.`;
  if(rj[0]!==rk[0]&&sk!=='-')return sk==='R'?`${Q(tok)} descreve ${Q(L(rj))}, e este espaço é a descrição de ${Q(L(rk))}.`:`${Q(tok)} é um item ligado a ${Q(R(rj))}, mas aqui vem um item de ${Q(R(rk))}.`;
  const ctx=q.slice(Math.max(rk[0],k-4),k).join(' ');
  return ctx?`Releia: ${Q(ctx+' …')} A peça ${Q(tok)} não continua essa ideia nesse ponto.`:`${Q(tok)} não abre essa ideia. Pense em qual peça vem primeiro.`;
}
function whyWrong(p,s){
  const t=s.dataset.t,tok=p.dataset.v,Q=x=>`“${x}”`,row=s.closest&&s.closest('.row'),ex=row&&row.querySelector('.ex');
  if(t==='x')return null;
  if(kind==='tab'||kind==='clash'||kind==='cores'){
    const m=ex&&ex.textContent.match(/(\d+)\s*×\s*(\d+)/),n=+tok;
    if(m&&isFinite(n)){const a=+m[1],b=+m[2];
      if(n===a*b)return null;
      if(n===a*(b-1))return `<b>${n}</b> é ${a} × ${b-1}, o resultado anterior. Para ${a} × ${b}, some mais ${a}.`;
      if(n===a*(b+1))return `<b>${n}</b> é ${a} × ${b+1}, o próximo. Para ${a} × ${b}, tire ${a} desse valor.`;
      if(n%a===0&&n/a<=10)return `<b>${n}</b> é ${a} × ${n/a}, não ${a} × ${b}.`;
      if(n%b===0&&n/b<=10)return `<b>${n}</b> é ${n/b} × ${b}, não ${a} × ${b}.`;
      return `<b>${n}</b> não aparece na tabuada de ${a} nem na de ${b}. Refaça partindo de ${a} × ${b-1}.`}}
  if(kind==='rule'){
    const b=RS[rIdx].b[rb];if(!b)return null;
    if(b.w&&b.w[tok])return b.w[tok];
    if(b.r){const bs=s.closest('.lr'),c=bs&&bs.querySelector('.bs');return `<b>${tok}</b> não pareia com <b>${c?c.textContent:'essa base'}</b>. Regra: A pareia com T, e C pareia com G.`}
    return pairWhy(b.q,s,tok);
  }
  if(kind==='form'){
    const nm=FM[fType].f[fIdx][0];
    if(t==='c'){const o=Object.keys(CM).find(n=>CM[n][1]===tok&&n!==nm);return o?`${Q(tok)} é a ação de ${Q(o)}, que aparece quando o enunciado diz “${CM[o][0]}”. Aqui o enunciado é outro: releia-o.`:`${Q(tok)} não responde ao que o enunciado pede. Releia a frase entre aspas.`}
    if(t==='s'){const y=(SY[nm]||[]).find(x=>x[1]===tok),sy=row&&row.firstElementChild?row.firstElementChild.textContent.trim():'';return y?`${Q(tok)} é o nome de <b>${y[0]}</b>${sy?', não de <b>'+sy+'</b>':''}.`:`${Q(tok)} não é o nome dessa letra. Pense no que ela mede.`}
    if(t==='f'){const o=Object.values(FM).flatMap(T=>T.f).find(f=>f[1]===tok);return o?`${Q(tok)} é a fórmula de ${Q(o[0])}${FW[o[0]]?': '+FW[o[0]]:''}`+(ex?` Aqui é ${Q(ex.textContent.trim())}.`:''):null}
    if(t==='q'){const sl=[...s.parentElement.children].filter(x=>!x.classList.contains('pbk')),k=sl.indexOf(s),bf=sl.slice(Math.max(0,k-5),k).map(x=>x.classList.contains('ok')?x.dataset.v:'▢').join(' ');return `${Q(tok)} não vai depois de ${Q(bf||'início')}. ${FW[nm]?'Lembre: '+FW[nm]:'Releia a ideia da fórmula.'}`}
  }
  if(kind==='unit'&&(t==='o'||t==='u'))return `Na escada de unidades, cada casa para a unidade menor multiplica por 10, e cada casa para a maior divide por 10. ${Q(tok)} não segue isso aqui.`;
  if(ex)return `${Q(tok)} não combina com ${Q(ex.textContent.trim().slice(0,60))}. Releia esse item e compare.`;
  return `${Q(tok)} não vai nessa posição. Releia as pistas ao redor e tente outra peça.`;
}
