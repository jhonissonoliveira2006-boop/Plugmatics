<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabuada de Encaixe</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1b2233;--mute:#6b7488;--line:#dde2ec;--sh:0 6px 18px rgba(30,40,70,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1c2230;--ink:#eef1f8;--mute:#98a2b8;--line:#2d3649;--sh:0 6px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1c2230;--ink:#eef1f8;--mute:#98a2b8;--line:#2d3649;--sh:0 6px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:16px 16px 28px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:800;padding:11px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.t{position:relative;border:0;text-align:left;font:inherit;color:#fff;border-radius:18px;padding:16px;min-height:104px;cursor:pointer;background:hsl(var(--h) 62% 50%);box-shadow:var(--sh);transition:transform .15s}
.t:active,.m:active{transform:scale(.97)}
.t b{font-size:38px;line-height:1;display:block}
.t small{display:block;margin-top:8px;opacity:.92;font-weight:700}
.t.lock{background:var(--line);color:var(--mute);cursor:not-allowed;box-shadow:none}
.t .ck{position:absolute;right:12px;top:10px;font-size:18px}
.m{display:block;width:100%;border:0;text-align:left;font:inherit;color:#fff;border-radius:20px;padding:18px 20px;margin-bottom:12px;cursor:pointer;background:hsl(var(--h) 62% 50%);box-shadow:var(--sh);transition:transform .15s}
.m b{font-size:22px;display:block}
.m small{display:block;margin-top:4px;opacity:.92;font-weight:700;font-size:14px}
.ar{margin:22px 0 10px;padding:9px 14px;border-radius:12px;color:#fff;font-weight:900;font-size:14px;line-height:1.25;background:hsl(var(--h) 55% 36%)}
.fr{display:flex;gap:8px;margin-bottom:12px}.fr .m{flex:1;width:auto;min-width:0;margin-bottom:0}
.pp{flex:none;width:78px;border:0;border-radius:20px;background:hsl(var(--h) 45% 30%);color:#fff;font:inherit;font-size:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;box-shadow:var(--sh)}.pp small{font-size:11px;font-weight:800;margin-top:2px;line-height:1.1;text-align:center}
.sec{margin:22px 0 10px}
.sh{display:flex;align-items:stretch;gap:6px;border-radius:12px;color:#fff;background:hsl(var(--h) 55% 36%)}
.st{flex:1;display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;color:inherit;font:inherit;font-weight:900;font-size:14px;line-height:1.25;padding:10px 6px 10px 14px;cursor:pointer}
.cv{display:inline-block;transition:transform .2s}.sec.open .cv{transform:rotate(90deg)}
.dk{flex:none;align-self:center;margin-right:8px;border:0;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font:inherit;font-weight:800;font-size:13px;padding:7px 10px;cursor:pointer}
.sb{display:none;margin-top:10px}.sec.open .sb{display:block}
.dc{background:var(--card);border:1px solid var(--line);border-left:5px solid hsl(var(--h) 62% 50%);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.dc b{display:block;font-size:15px}.dc p{margin:5px 0 0;color:var(--mute);font-size:14px;line-height:1.4}
.mol{width:100%;max-height:150px;height:auto;display:block;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none;color:var(--ink)}
.mol text{fill:currentColor;stroke:none;font:700 14px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.mb{fill:var(--card);stroke:none}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fig{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;color:var(--ink);cursor:pointer}
.fig.sel{border-color:#3b82f6}.fig.ok{border-color:#1e9e5a;opacity:.7}
.nmw{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.nmb{flex:1 1 40%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;border-radius:14px;padding:12px 8px;cursor:pointer}
.nmb.ok{border-color:#1e9e5a;background:#1e9e5a22}.nmb.bad{border-color:#e5484d;background:#e5484d22}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer}
.ttl{flex:1;font-weight:900;font-size:20px}
.tm{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:96px;text-align:center}
.tm.g{color:#1e9e5a}.tm.o{color:#e07a1f}
.best{color:var(--mute);font-size:13px;margin:-4px 0 10px;text-align:right}
.board{display:grid;gap:10px}
.row{display:flex;align-items:center}
.ex{position:relative;flex:1.1;height:56px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#fff;background:hsl(var(--h) 62% 50%);border-radius:12px 0 0 12px}
.sl{position:relative;flex:.9;height:56px;border:2px dashed var(--line);border-left:0;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#fff;padding-left:12px;cursor:pointer}
.sl.rs{flex:1.2;border-radius:0 12px 12px 0}
.rs::before{content:"=";margin-right:6px;color:var(--mute)}
.sl.ok{border:0;background:hsl(var(--h) 62% 40%);animation:pop .35s}
.sl.ok.rs::before{color:#fff;opacity:.7}
.sl.bad{animation:shake .35s;border-color:#e5484d}
.kn{position:absolute;right:-12px;top:var(--y);width:24px;height:24px;margin-top:-12px;background:inherit;z-index:3}
.s0{border-radius:50%}.s1{border-radius:3px}.s2{border-radius:3px;transform:rotate(45deg)}.s3{border-radius:50% 50% 3px 3px}
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:20;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;background:var(--card);border:1px solid var(--line);border-bottom:0;box-shadow:0 -8px 24px rgba(0,0,0,.14)}
.pc{position:relative;overflow:hidden;height:56px;border-radius:12px;background:hsl(var(--h) 62% 40%);color:#fff;font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ho{position:absolute;left:-12px;top:var(--y);width:24px;height:24px;margin-top:-12px;background:var(--card)}
.ut{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sl.us{flex:none;height:64px;border:2px dashed var(--line);border-radius:12px;padding:0;font-size:15px}
.sl.us.ok{border:0}
.pc.pu{width:56px;height:56px;font-size:17px}
.pc.po{width:80px;font-size:22px}
.ux{flex:.6;font-size:20px;border-radius:12px 0 0 12px}
.sl.nm{flex:1.8;font-size:15px;border-radius:0;padding-left:8px}
.sl.eq{flex:1.4;font-size:15px}
.pc.pt{width:auto;min-width:56px;padding:0 10px;height:46px;font-size:14px}
.ex.fn{flex:1;font-size:14px;line-height:1.15;padding:0 8px;text-align:center}
.sl.fs{flex:1.5;font-size:15px;line-height:1.15;padding:0 6px;text-align:center;border-radius:0 12px 12px 0}
.pc.pf2{font-size:13px;min-width:0;padding:0 9px;height:42px}
.az{display:flex;align-items:center;gap:12px;margin:12px 0}
.az .sl{flex:none;width:92px;height:48px;font-size:20px}
.az.off{opacity:.3}
.al{flex:1;position:relative;height:5px;border-radius:3px;background:hsl(var(--h) 62% 50%)}
.al.r::after{content:"";position:absolute;right:-3px;top:-8px;border:10px solid transparent;border-left:16px solid hsl(var(--h) 62% 50%);border-right:0}
.al.l::after{content:"";position:absolute;left:-3px;top:-8px;border:10px solid transparent;border-right:16px solid hsl(var(--h) 62% 50%);border-left:0}
.ar{display:flex;gap:14px;margin-top:22px}
.ac{flex:1;text-align:center}
.ac .sl{width:100%;font-size:22px}
.ah{font-size:46px;line-height:1;color:hsl(var(--h) 62% 50%);font-weight:900;margin-top:4px}
.pf{width:48px}.pr{width:62px}
.fh{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:20px;color:#fff;background:hsl(var(--h) 62% 50%);border-radius:14px;padding:14px}
.eqw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.sl.tk{flex:none;min-width:46px;height:52px;border:2px dashed var(--line);border-radius:10px;padding:0 8px;font-size:22px}
.sl.tk.ok{border:0}
.pc.tp{min-width:46px;height:50px;padding:0 10px;font-size:22px}
.m.lock{background:var(--line);color:var(--mute);cursor:not-allowed;box-shadow:none}
.rb{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.rt{font-size:16px;line-height:1.45;margin-bottom:8px}
.rt b{color:hsl(var(--h) 62% 55%)}
.rv{font-size:22px;font-weight:900;text-align:center;padding:10px;margin-bottom:10px;border-radius:12px;background:var(--bg);color:hsl(var(--h) 62% 55%)}
.lad{display:grid;gap:6px;justify-content:center}
.lr{display:flex;align-items:center;gap:8px}
.bs{width:46px;height:46px;border-radius:10px;color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
.bd{color:var(--mute);font-size:22px;width:32px;text-align:center}
.rv.sv{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:400;padding:8px}
.pc.neu{background:#59627a}.pc.same{background:hsl(var(--h) 62% 50%)}
.pc.sel{outline:3px solid var(--ink);outline-offset:2px}
.pc.drag{z-index:50;cursor:grabbing;box-shadow:0 12px 24px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(10,14,25,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}
.ov.show{display:flex}
.box{background:var(--card);border-radius:24px;padding:26px 22px;width:100%;max-width:360px;text-align:center;animation:pop .4s}
.stars{font-size:38px;letter-spacing:6px}
.box h2{margin:6px 0 4px}.box p{margin:4px 0;color:var(--mute)}
.big{font-size:42px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px;background:hsl(var(--h) 62% 46%);color:#fff}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.hb{display:flex;align-items:center;justify-content:center;padding:0}
.bulb{width:26px;height:26px;display:block;overflow:visible}
.hl{text-align:left;max-height:55vh;overflow:auto;margin:12px 0 4px}
.hr{padding:9px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:16px}
.hr:last-child{border-bottom:0}
.hr b{font-weight:900}
.hr small{display:block;color:var(--mute);font-size:13px;margin-top:3px;line-height:1.35}
.hr.dn{opacity:.5}
.hx{text-align:left;color:var(--mute);font-size:14px;line-height:1.4;margin:6px 0 0}
.hx b{color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}

/* caixas de texto longo (comando, ação, significado das letras) crescem com o conteúdo */
.cmdw{display:grid;gap:8px}
.cmd{background:hsl(var(--h) 62% 50%);color:#fff;font-weight:800;font-size:17px;line-height:1.3;padding:14px 16px;border-radius:14px;text-align:left}
.sl.lg{height:auto;min-height:56px;width:auto;padding:10px 12px;font-size:15px;line-height:1.25;text-align:center;white-space:normal;overflow-wrap:anywhere}
.cmdw .sl.lg{flex:none;width:100%;border:2px dashed var(--line);border-radius:12px;min-height:64px;font-size:16px}
.cmdw .sl.lg.ok{border:0}
.row.lgr{align-items:stretch}
.row.lgr .ex{height:auto;min-height:56px}
.row.lgr .sl.lg{flex:1.8;width:auto;border:2px dashed var(--line);border-left:0;border-radius:0 12px 12px 0}
.row.lgr .sl.lg.ok{border:0}
.pc.lg{height:auto;min-height:46px;max-width:100%;padding:9px 12px;font-size:15px;line-height:1.25;text-align:center;white-space:normal;overflow:visible}
.pc.lg.wide{flex:1 1 100%}
.ex.fn{height:auto;min-height:56px}
.sl.fs{height:auto;min-height:56px;padding-top:6px;padding-bottom:6px}
.pc.pf2{height:auto;min-height:42px;white-space:normal;padding-top:8px;padding-bottom:8px;text-align:center}
/* Geografia: mapa */
.mapw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;max-width:560px;margin:8px auto 0;width:100%}
#msvg{display:block;width:100%;height:auto;max-height:60vh;touch-action:manipulation}
.ms{stroke:currentColor;stroke-opacity:.5;stroke-width:.9;stroke-linejoin:round;cursor:pointer}
.ms.ctx{fill:hsl(210 10% 55% / .10);stroke-opacity:.22;cursor:default;pointer-events:none}
.ms.tg{fill:hsl(210 20% 55% / .22)}
.ms.fill{fill:hsl(var(--rh) 62% 45%);stroke:#fff;stroke-opacity:.9;animation:popm .45s}
.ms.bad{animation:blinkm .45s}
.ms.hint{animation:hlm .5s ease-in-out 3 alternate}
@keyframes popm{from{fill-opacity:.15}to{fill-opacity:1}}
@keyframes blinkm{50%{fill:hsl(5 75% 55%)}}
@keyframes hlm{to{fill:hsl(48 95% 55%)}}
.ml{fill:#fff;font-weight:800;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:1.4;stroke-linejoin:round}
.mpc{position:relative;display:flex;align-items:center;gap:12px;background:hsl(var(--h) 62% 40%);color:#fff;border-radius:16px;padding:8px 16px 8px 10px;font-weight:900;font-size:19px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.mpc.sel{outline:3px solid var(--ink);outline-offset:2px}
.mpc.drag{z-index:50;cursor:grabbing;box-shadow:0 12px 24px rgba(0,0,0,.3)}
.mbt{display:flex;gap:8px}
.mb{border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:15px;border-radius:12px;padding:10px 14px;cursor:pointer}
.mb:disabled{opacity:.4}

.mapw{position:relative}
#msvg{touch-action:none}
.mz{position:absolute;top:10px;right:10px;display:grid;gap:6px;z-index:5}
.mz button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:900;cursor:pointer;line-height:1}
.ms.aim{stroke:#ffd23f;stroke-opacity:1;stroke-width:2.4}
.mpc{display:flex;align-items:center;gap:12px;font-weight:900;font-size:19px;color:var(--ink);user-select:none;background:none;box-shadow:none;padding:0;border-radius:0;outline:0;cursor:default}
.mpc.sel,.mpc.drag{outline:0;box-shadow:none}
.mps{overflow:visible;pointer-events:none;transition:opacity .15s}
.mps path{pointer-events:auto;cursor:grab;touch-action:none}
.mps.lift{opacity:.3}
.mfx{flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;text-align:left;font-size:12.5px;line-height:1.3;color:var(--ink);border-top:1px solid var(--line);padding-top:10px}
.mfx b{display:block;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute)}
.mfx .mft{grid-column:1/-1;font-weight:900;font-size:15px}
.pcard{background:var(--card);border:1px solid var(--line);border-left:6px solid hsl(var(--h) 62% 45%);border-radius:14px;padding:12px 14px;margin:0 0 10px;display:grid;gap:4px;text-align:left}
.pcard b{font-size:16px}.pcard span{font-size:13px;font-weight:800;color:hsl(var(--h) 55% 40%)}
@media (prefers-color-scheme:dark){.pcard span{color:hsl(var(--h) 65% 70%)}}
.pcard p{margin:0;font-size:13.5px;line-height:1.4;color:var(--mute)}
.pj{width:64px;height:48px;flex:none;color:hsl(var(--h) 60% 45%)}
.pcard .ph{display:flex;gap:12px;align-items:center}.pcard .ph>div{display:grid;gap:4px}
.mfx .mfn{grid-column:1/-1;color:var(--mute);font-size:11px}
@media (max-width:420px){.mfx{font-size:12px;gap:5px 10px}}
.mgh{position:fixed;left:0;top:0;pointer-events:none;z-index:60;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
</style>

<body>
<div class="app" id="app"></div>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<script>
let fNat=false,aOpen=[];const NK=['f','fm','fc','fe','qa','qb'];
const $=s=>document.querySelector(s);
const rnd=a=>a.sort(()=>Math.random()-.5);
const ri=n=>Math.floor(Math.random()*n);
let mode='lin',kind='tab',bk=0,total=20,ttl='',cur=0,placed=0,miss=0,t0=0,tick=null,sel=null,AC=null;
let store={done:[],best:{}};
try{const s=localStorage.getItem('tabuada2');if(s)store=JSON.parse(s)}catch(e){}
store.fb=store.fb||{};
const save=()=>{try{localStorage.setItem('tabuada2',JSON.stringify(store))}catch(e){}};
const hue=n=>({3:200,4:150,5:35,6:280,7:340,8:12,9:230})[n];
const fmt=ms=>{const s=ms/1000,m=Math.floor(s/60);return m+':'+(s%60).toFixed(1).padStart(4,'0')};
const K=()=>({s:ri(4),y:[28,50,72][ri(3)]});
let uType='c',uN=7,fType='g',fMode='match',fIdx=0,rIdx=0,rb=0,rcum=[],RS=null,rk='r';
let mus='off',mTimer=null;
try{mus=localStorage.getItem('tabuada_mus')||'off'}catch(e){}
function musicStop(){clearInterval(mTimer);mTimer=null}
function musicStart(){
  musicStop();if(mus==='off')return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){return}
  const F=m=>440*Math.pow(2,m/12),calm=mus==='calm',step=calm?1.1:.29;
  const tone=(f,t,d,ty,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(calm?.4:.012));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)};
  const ch=[[0,[0,3,7]],[-4,[0,4,7]],[-9,[0,4,7]],[-2,[0,4,7]]];
  let nt=AC.currentTime+.1,i=0;
  const sched=(t,i)=>{
    const c=ch[Math.floor(i/(calm?4:8))%4],r=c[0],iv=c[1];
    if(calm){
      if(i%4===0)iv.forEach(x=>tone(F(r+x-12),t,5,'triangle',.03));
      if(Math.random()<.8)tone(F(r+iv[Math.floor(Math.random()*3)]+12*(Math.random()<.5?1:0)),t,3.2,'sine',.05);
    }else{
      const p=[0,1,2,1,0,1,2,1][i%8];tone(F(r+iv[p]+12),t,.26,'triangle',.05);
      if(i%4===0)tone(F(r-24),t,.55,'sine',.12);
    }
  };
  mTimer=setInterval(()=>{while(nt<AC.currentTime+.3){sched(nt,i++);nt+=step}},60);

function snd(type,k){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    if(type==='ok'){
      const sc=[0,2,4,7,9,12,14,16,19,21],f=392*Math.pow(2,sc[k%10]/12);
      o.type='triangle';o.frequency.setValueAtTime(f*0.7,t);o.frequency.exponentialRampToValueAtTime(f,t+.05);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
      o.start(t);o.stop(t+.3);
      const c=AC.createOscillator(),h=AC.createGain();c.type='square';c.frequency.setValueAtTime(180,t);c.frequency.exponentialRampToValueAtTime(60,t+.05);
      c.connect(h);h.connect(AC.destination);h.gain.setValueAtTime(.3,t);h.gain.exponentialRampToValueAtTime(.0001,t+.07);c.start(t);c.stop(t+.08);
    }else if(type==='bad'){
      o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(90,t+.18);
      g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22);
    }else{
      [523,659,784,1047].forEach((f,i)=>{const a=AC.createOscillator(),b=AC.createGain();a.type='triangle';a.frequency.value=f;
      a.connect(b);b.connect(AC.destination);const s=t+i*.12;b.gain.setValueAtTime(.0001,s);b.gain.exponentialRampToValueAtTime(.3,s+.02);b.gain.exponentialRampToValueAtTime(.0001,s+.4);a.start(s);a.stop(s+.45)});
    }
  }catch(e){}
}

function hint(){

  if(t0){clearInterval(tick);hintT=performance.now()}else hintT=0;
  if(kind==='tab'||kind==='clash'||kind==='cores'){
    hh=kind==='tab'?hue(cur):250;
    intro=`<b>Truque:</b> a × b = a × (b − 1) + a. Ou seja, parta do resultado anterior e some o número.`+(kind==='cores'?' A cor da conta é a mesma do resultado.':'');
    rows=curRows.slice().sort((x,y)=>x.a-y.a||x.b-y.b).map(r=>{const v=r.a*r.b;
      return hrow((kind==='cores'?`<i class="dot" style="background:hsl(${r.h} 62% 50%)"></i>`:'')+`${r.a} × ${r.b} = ${v}`,mulWhy(r.a,r.b),isOk('r',v))}).join('');
  }else if(kind==='unit'){

    if(placed<uN){
      intro=`<b>Ordem:</b> da maior para a menor unidade: quilo, hecto, deca, a base, deci, centi, mili. Cada passo para a direita é uma unidade menor.`;
      rows=T.u.map((u,i)=>hrow(u,PFX[i],isOk('u',u))).join('');
    }else if(placed<2*uN){
      intro=`<b>Os nomes</b> vêm dos prefixos, que dizem o tamanho de cada unidade em relação à base.`+(uType==='a'||uType==='v'?` Aqui vale o nome da unidade de comprimento, mais "${X.suf.trim()}".`:'');

    }else{
      const F=f.toLocaleString('pt-BR');

      else if(EXR[f[0]]&&placed>=fC+fTk+(SY[f[0]]||[]).length){intro=`<b>${f[0]}:</b> a resolução do exemplo, na ordem.`;rows=hrow(EXR[f[0]].q.join(' '),EXR[f[0]].p,false)}
      else if(placed>=fC+fTk&&SY[f[0]]){intro=`<b>${f[0]}:</b> o que cada letra significa.`;rows=SY[f[0]].map(x=>hrow(x[0],x[1],isOk('s',x[1]))).join('')}

function molSVG(m){
  if(m.ring){const P=[0,1,2,3,4,5].map(k=>[50+30*Math.cos((k*60-90)*Math.PI/180),50+30*Math.sin((k*60-90)*Math.PI/180)]);let d='';
    for(let k=0;k<6;k++){const a=P[k],b=P[(k+1)%6];d+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
      if(m.ring==='b'&&k%2===0){const f=(p,q)=>[p[0]+(50-p[0])*.17+(q[0]-p[0])*.14,p[1]+(50-p[1])*.17+(q[1]-p[1])*.14],g=(p,q)=>[q[0]+(50-q[0])*.17+(p[0]-q[0])*.14,q[1]+(50-q[1])*.17+(p[1]-q[1])*.14],u=f(a,b),v=g(a,b);d+=`<line x1="${u[0]}" y1="${u[1]}" x2="${v[0]}" y2="${v[1]}"/>`}}
    return `<svg viewBox="0 0 100 100" class="mol">${d}</svg>`}
  const n=m.n,X=i=>26+i*34,Y=i=>i%2?34:58,A=[],Bn=[];
  for(let i=0;i<n;i++)A.push({x:X(i),y:Y(i)});
  for(let i=0;i<n-1;i++)Bn.push([i,i+1,m.b[i]]);
  const br=i=>Y(i)>46?84:8,add=(x,y,l)=>{A.push({x,y,l});return A.length-1};
  if(['OH','NH₂','Cl'].includes(m.g))Bn.push([n-1,add(X(n),Y(n),m.g),1]);
  if(m.g==='CHO')Bn.push([n-1,add(X(n-1),br(n-1),'O'),2]);
  if(m.g==='CETONA')Bn.push([1,add(X(1),br(1),'O'),2]);
  if(m.g==='COOH'){Bn.push([n-1,add(X(n-1),br(n-1),'O'),2]);Bn.push([n-1,add(X(n),Y(n),'OH'),1])}
  const W=26*2+(n+(m.g==='OH'||m.g==='NH₂'||m.g==='Cl'||m.g==='COOH'?1:0))*34;let d='';
  Bn.forEach(([a,b,o])=>{const p=A[a],q=A[b],dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,offs=o===1?[0]:o===2?[-2.8,2.8]:[-4.5,0,4.5];
    offs.forEach(k=>d+=`<line x1="${p.x+nx*k}" y1="${p.y+ny*k}" x2="${q.x+nx*k}" y2="${q.y+ny*k}"/>`)});
  A.forEach(a=>{if(a.l)d+=`<circle cx="${a.x}" cy="${a.y}" r="${a.l.length>1?13:9}" class="mb"/><text x="${a.x}" y="${a.y}">${a.l}</text>`});
  return `<svg viewBox="0 0 ${W} 92" class="mol">${d}</svg>`;
}

const srt=a=>a.slice().sort((x,y)=>x-y),sm=a=>a.reduce((x,y)=>x+y,0),avg=a=>sm(a)/a.length;

const vfE=()=>{const R=[];for(let i=0;i<10;i++){const t=Math.random()<.5,k=i%5;let a;

  else if(k===3){do a=dsx(7);while(mo(a).length>1||a.filter(x=>x===mo(a)[0]).length<2);const m=mo(a)[0],o=PK(a.filter(x=>x!==m));R.push({c:'Moda',q:'Este valor está certo?',s:`Dados: ${a.join(', ')}. Moda = ${t?m:o}`,v:t,w:`O ${m} aparece ${a.filter(x=>x===m).length} vezes, mais que os outros.`})}

const vfGT=()=>{const R=[];for(let i=0;i<10;i++){const t=Math.random()<.5,L=['Jan','Fev','Mar','Abr','Mai'],v=rnd([20,30,40,50,60,70,80,90]).slice(0,5),g=bars(L,v),k=i%4,a=ri(5),b=(a+1+ri(4))%5,M=Math.max(...v);

  else if(k===1){const d=Math.abs(v[a]-v[b]);R.push({c:'Lendo a tabela: diferença',q:'Esta conta está certa?',s:g+`<div style="margin-top:8px">${L[a]} e ${L[b]} diferem em <b>${t?d:d+10}</b></div>`,v:t,w:`${Math.max(v[a],v[b])} − ${Math.min(v[a],v[b])} = ${d}.`})}

  else{const m=avg(v);R.push({c:'Lendo a tabela: média',q:'Esta média está certa?',s:g+`<div style="margin-top:8px">A média dos cinco meses é <b>${nf(t?m:m+10)}</b></div>`,v:t,w:`Soma ${sm(v)} ÷ 5 = ${nf(m)}.`})}}

const vfFP=()=>{const R=[],sg=n=>n<0?'− '+(-n):'+ '+n;for(let i=0;i<10;i++){const t=Math.random()<.5,k=i%6;

  else if(k===1){const a=PK([2,3,-2,-4]),r=PK([-3,-2,2,3,4]),b=-a*r;R.push({c:'Raiz da função do 1º grau',q:'Esta raiz está certa?',s:`f(x) = ${a}x ${sg(b)} tem raiz x = ${t?r:-r}`,v:t,w:`ax + b = 0 → x = −b ÷ a = ${-b} ÷ ${a} = ${r}.`})}
  else if(k===2){const a=PK([-3,-2,-1,1,2,3]),b=ri(7)-3,c=ri(7)-3,up=a>0;R.push({c:'Concavidade da parábola',q:'Esta afirmação está certa?',s:`f(x) = ${a}x² ${sg(b)}x ${sg(c)}: concavidade para ${(t?up:!up)?'cima':'baixo'}`,v:t,w:`Só o sinal de a conta: a ${up?'> 0, para cima':'< 0, para baixo'}.`})}
  else if(k===3){const a=PK([-2,-1,1,2]),x=PK([-3,-2,-1,1,2,3,4]),b=-2*a*x,c=ri(7)-3;R.push({c:'Vértice da parábola',q:'Este Xv está certo?',s:`f(x) = ${a}x² ${sg(b)}x ${sg(c)} tem Xv = ${t?x:-x}`,v:t,w:`Xv = −b ÷ 2a = ${-b} ÷ ${2*a} = ${x}.`})}
  else if(k===4){const p=PK([10,20,25,50]),q=PK([10,20,40]),up=Math.random()<.5,f=(1+p/100)*(up?1+q/100:1-q/100),ex=Math.round((f-1)*1e4)/100,nv=up?p+q:p-q;R.push({c:'Porcentagem sucessiva',q:'Esta variação total está certa?',s:`Aumento de ${p}% e depois ${up?'aumento':'desconto'} de ${q}%: variação total de ${nf(t?ex:nv)}%`,v:t,w:`Multiplique os fatores: 1,${p<100?String(p).padStart(2,'0'):p} × ${up?'1,':'0,'}${String(up?q:100-q).padStart(2,'0')} = ${nf(f)}, ou seja, ${nf(ex)}%. Somar os percentuais engana.`})}

  return R};

/* Passo a passo das fórmulas */
function passos(k,i){
  clearInterval(tick);$('#ov').classList.remove('show');kind='form';fType=k;fMode='menu';
  const T=FM[k],f=T.f[i],n=f[0],c=CM[n],S=SY[n]||[],e=EXR[n],st=[];
  if(c)st.push(['Reconheça o que o enunciado pede','Quando o texto diz “'+c[0]+'”, a ação é: '+c[1].toLowerCase()+'.','O enunciado quase nunca cita a fórmula: ele descreve uma situação. Ligar o comando à ação é o que diz qual relação usar e evita pegar a fórmula errada.']);
  st.push(['Escreva a fórmula','<b>'+f[1]+'</b>',FW[n]||'Toda fórmula resume uma relação entre grandezas.']);
  if(S.length)st.push(['Dê nome a cada letra',S.map(x=>'<b>'+x[0]+'</b> = '+x[1]).join('<br>'),'Cada letra é uma grandeza. Saber o que ela representa evita trocar um dado pelo outro na hora de substituir.']);
  st.push(['Separe os dados e confira as unidades','Anote o valor de cada letra que o texto dá. A letra que não tem valor é a incógnita. Converta tudo para unidades que combinam.','A fórmula só funciona com unidades compatíveis (km/h junto com segundos dá resposta errada). E a incógnita é justamente o que falta descobrir.']);
  if(e)st.push(['Substitua e calcule',e.p+'<br><b>'+e.q.join(' ')+'</b>','Troque as letras pelos números antes de calcular e resolva na ordem: parênteses, potências, × e ÷, depois + e −. Assim cada passo fica fácil de conferir.']);
  st.push(['Confira se o resultado faz sentido','Veja o valor e a unidade da resposta: eles são possíveis na situação do enunciado?','Erro de conta ou de unidade costuma gerar valores absurdos, e o Enem usa esses valores como alternativas erradas.']);
  $('#app').innerHTML=`<div class="top"><button class="ib" onclick="fSection('${k}')" aria-label="Voltar">←</button><div class="ttl">📖 Passo a passo</div></div><div class="ar" style="--h:${T.h};margin-top:4px">${n}</div>`
  +st.map((x,j)=>`<div class="dc" style="--h:${T.h}"><b>${j+1}. ${x[0]}</b><p><strong>O que fazer:</strong> ${x[1]}</p><p><strong>Por quê:</strong> ${x[2]}</p></div>`).join('')
  +(DET[n]?`<p class="sub" style="margin:22px 0 8px;font-weight:800">🔎 Passo a passo detalhado, para esta fórmula difícil</p>`+DET[n].map((x,j)=>`<div class="dc" style="--h:${T.h}"><b>${j+1}. ${x[0]}</b><p><strong>O que fazer:</strong> ${x[1]}</p><p><strong>Por quê:</strong> ${x[2]}</p></div>`).join(''):'')
  +`<button class="m" style="--h:${T.h};margin-top:18px" onclick="startB('${k}',${i})"><b>Montar esta fórmula</b><small>Agora é com você: monte peça por peça</small></button>`;
  window.scrollTo(0,0);
}

const D=(n,a)=>{DET[n]=a};
D('Equação de Torricelli',[
['Use quando o tempo não aparece','Se o problema dá velocidades e distância mas não fala em tempo, é esta a fórmula.','Ela nasce de juntar v = v₀ + a × t com a posição no MUV, eliminando o t. Por isso serve para freada, queda e rampa sem tempo.'],
['Calcule o lado direito primeiro','O resultado de v₀² + 2 × a × ΔS é <b>v²</b>, não v. Depois tire a raiz quadrada.','A velocidade está elevada ao quadrado na fórmula. Sem a raiz você responde com o quadrado da velocidade.'],
['Atenção ao sinal da aceleração','Freando, a é negativo (por exemplo a = −2).','A aceleração contra o movimento reduz v². Com o sinal errado, a velocidade final sairia maior que a inicial.'],
['Exemplo: freada até parar','Carro a 10 m/s freia com a = −2 até parar (v = 0). Então 0 = 10² + 2 × (−2) × ΔS, ou seja, 0 = 100 − 4 × ΔS e <b>ΔS = 25 m</b>.','Aqui a incógnita é ΔS: substitua tudo e depois isole. Parar significa v = 0.']]);
D('Posição no MUV',[
['Separe a fórmula em 3 partes','S₀ (onde começou) + v₀ × t (o que andaria sem acelerar) + a × t² ÷ 2 (o extra da aceleração).','Cada parte tem um significado físico. Entender isso evita esquecer um termo.'],
['Faça t² antes de multiplicar','Em a × t² ÷ 2, o quadrado vale só para o t. Calcule t² primeiro.','Pela ordem das operações, a potência vem antes da multiplicação. Errar aqui é o engano mais comum.'],
['Exemplo: parte do repouso','S₀ = 5, v₀ = 0, a = 2, t = 4. Então S = 5 + 0 + 2 × 16 ÷ 2 = 5 + 16 = <b>21</b>.','“Parte do repouso” significa v₀ = 0, o que zera um termo. É muito comum no Enem.'],
['Confira o caso especial','Se a = 0, sobra S = S₀ + v × t, que é o MU.','Se a sua fórmula não vira o MU quando a = 0, algum termo está errado.']]);
D('Empuxo',[
['A densidade é a do líquido','Em E = d × V × g, o d é a densidade do <b>líquido</b>, não a do corpo.','O empuxo é o peso do líquido deslocado. A densidade do corpo só decide se ele afunda ou flutua.'],
['O volume é só o que está submerso','Se o corpo flutua, V é a parte mergulhada, não o volume total.','Só a parte dentro do líquido empurra líquido para fora.'],
['Flutuando: empuxo = peso','No equilíbrio, E = P. Então d(líquido) × V(submerso) × g = m × g.','Não há aceleração, então as forças se anulam. Com isso você descobre quanto do corpo fica submerso.'],
['Exemplo','Bloco totalmente na água: V = 0,003 m³, d = 1000 kg/m³ e g = 10. E = 1000 × 0,003 × 10 = <b>30 N</b>.','Use d em kg/m³ e V em m³ (1 L = 0,001 m³), senão o resultado sai errado.']]);
D('Prensa hidráulica',[
['A pressão é igual nos dois êmbolos','Como p = F ÷ A, vale F₁ ÷ A₁ = F₂ ÷ A₂.','O líquido transmite a pressão por igual (princípio de Pascal).'],
['Isole a incógnita','Para achar F₂: F₂ = F₁ × A₂ ÷ A₁.','Passar A₂ multiplicando para o outro lado mantém a igualdade e deixa F₂ sozinha.'],
['Exemplo','F₁ = 30 N, A₁ = 2 e A₂ = 10. Então F₂ = 30 × 10 ÷ 2 = <b>150 N</b>.','Áreas na mesma unidade. Se forem círculos, a razão das áreas é a razão dos quadrados dos raios.'],
['O que ganha em força, perde em deslocamento','O êmbolo menor desce bastante para o maior subir pouco.','O volume de líquido que sai de um lado é o que entra no outro. Não se ganha energia de graça.']]);
D('Resistores em paralelo',[
['Reconheça o paralelo','Os resistores estão ligados aos mesmos dois pontos: a tensão é a mesma em todos.','A fórmula só vale para esse tipo de ligação.'],
['Produto sobre soma','Multiplique R₁ × R₂, some R₁ + R₂ embaixo e divida.','Os parênteses indicam que a soma é feita antes da divisão.'],
['Exemplo','R₁ = 6 Ω e R₂ = 3 Ω. Req = 6 × 3 ÷ (6 + 3) = 18 ÷ 9 = <b>2 Ω</b>.','Substituir primeiro e resolver na ordem evita erros.'],
['Teste de bom senso','Req tem de ser menor que o menor resistor (2 é menor que 3).','Cada ramo é um caminho a mais para a corrente, então a resistência total cai. Se deu maior, errou. Para n resistores iguais, Req = R ÷ n.']]);
D('Transformador',[
['Pareie primário com primário','Up fica com Np, e Us fica com Ns.','A razão só faz sentido entre grandezas do mesmo lado.'],
['Isole a incógnita','Para achar Us: Us = Up × Ns ÷ Np.','Multiplicar em cruz é o jeito rápido de isolar numa proporção.'],
['Exemplo','Up = 120 V, Np = 200 e Ns = 100. Us = 120 × 100 ÷ 200 = <b>60 V</b>.','Menos espiras no secundário: a tensão cai.'],
['Abaixa ou eleva?','Ns menor que Np abaixa a tensão. Ns maior eleva. E só funciona com corrente alternada.','A tensão no secundário é induzida por um fluxo magnético que varia; corrente contínua não faz o fluxo variar.']]);
D('Celsius e Fahrenheit',[
['Guarde dois pontos de teste','A água congela a 0 °C = 32 °F e ferve a 100 °C = 212 °F.','Qualquer resultado que você achar deve respeitar esses dois pontos.'],
['De °C para °F','Faça C ÷ 5, multiplique por 9 e some 32.','As escalas têm tamanhos de grau diferentes (100 contra 180), por isso o 9 ÷ 5, e os zeros são diferentes, por isso o +32.'],
['De °F para °C','Subtraia 32 <b>antes</b> de tudo, depois divida por 9 e multiplique por 5.','O −32 está nos parênteses: primeiro alinha-se o zero das escalas.'],
['Exemplo','86 °F: 86 − 32 = 54; 54 ÷ 9 = 6; 6 × 5 = <b>30 °C</b>.','Resolver em passos curtos evita errar a ordem.']]);
D('Equação de Gauss',[
['Cuidado com os sinais','f positivo: lente convergente ou espelho côncavo. p′ positivo: imagem real. p′ negativo: imagem virtual.','O sinal diz o tipo de imagem. Esquecê-lo muda a resposta.'],
['Some frações com denominador comum','p = 30 e p′ = 60: 1 ÷ f = 1 ÷ 30 + 1 ÷ 60 = 2 ÷ 60 + 1 ÷ 60 = 3 ÷ 60.','Somar frações exige o mesmo denominador. Não some os denominadores.'],
['Inverta no final','A conta dá 1 ÷ f. Então f = 60 ÷ 3 = <b>20</b>.','Parar em 3 ÷ 60 é a pegadinha: o que se pede é f, não o inverso.']]);
D('Diluição',[
['Veja o que não muda','Só se adiciona água, então a quantidade de soluto é a mesma antes e depois.','Por isso C × V (soluto) é igual nos dois lados.'],
['V₂ é o volume final','V₂ = V₁ + água adicionada. “Adicionaram 300 mL” não é V₂.','Esta é a pegadinha: o volume final inclui o que já estava lá.'],
['Isole a incógnita','C₂ = C₁ × V₁ ÷ V₂. Mantenha os volumes na mesma unidade (pode ser mL).','A unidade do volume se cancela na razão, então não precisa converter se for a mesma dos dois lados.'],
['Exemplo','100 mL a 2 mol/L, mais 300 mL de água: V₂ = 400. C₂ = 2 × 100 ÷ 400 = <b>0,5 mol/L</b>.','Conferir: diluir sempre diminui a concentração.']]);
D('pH',[
['Escreva [H⁺] como potência de 10','Se [H⁺] = 10⁻³ mol/L, o log vale −3.','O log de 10 elevado a x é x. É o jeito mais rápido.'],
['Troque o sinal','pH = −log [H⁺] = −(−3) = <b>3</b>.','O sinal de menos na fórmula torna o pH positivo para concentrações pequenas.'],
['Se não for potência exata','[H⁺] = 2 × 10⁻⁴: pH = 4 − log 2 ≈ 4 − 0,3 = <b>3,7</b>.','O log de um produto é a soma dos logs: log(2 × 10⁻⁴) = log 2 − 4. O Enem costuma dar log 2 ≈ 0,3.'],
['Interprete','Menor pH, mais ácido. Cada unidade a menos é 10 vezes mais H⁺.','A escala é logarítmica: pH 3 é 10 vezes mais ácido que pH 4.']]);
D('Equação de Clapeyron',[
['Passe T para kelvin','K = °C + 273.','O zero absoluto é o ponto de partida da fórmula. Em °C ela não funciona.'],
['Use o R que combina com a pressão','O enunciado dá R. Com pressão em atm e volume em L, R ≈ 0,082.','R carrega as unidades. Misturar unidades dá resultado absurdo.'],
['Isole o que falta','p = n × R × T ÷ V, ou V = n × R × T ÷ p, ou n = p × V ÷ (R × T).','Primeiro isole, depois substitua: a conta fica mais limpa.'],
['Exemplo','n = 2, R = 0,08, T = 300 e V = 24. p = 2 × 0,08 × 300 ÷ 24 = 48 ÷ 24 = <b>2 atm</b>.','Se der um valor impossível (pressão de 1000 atm num balão), reveja as unidades.']]);
D('Lei geral dos gases',[
['Descubra o que fica constante','Temperatura constante: p₁ × V₁ = p₂ × V₂. Pressão constante: V₁ ÷ T₁ = V₂ ÷ T₂. Volume constante: p₁ ÷ T₁ = p₂ ÷ T₂.','A fórmula geral “corta” a grandeza que não muda. Isso simplifica a conta.'],
['Tudo em kelvin','Some 273 às temperaturas em °C.','As razões com T só valem na escala absoluta.'],
['Exemplo','2 atm e 6 L; o volume vai a 4 L na mesma temperatura. p₂ = 2 × 6 ÷ 4 = <b>3 atm</b>.','Aqui T cortou, sobrou p₁V₁ = p₂V₂.'],
['Confira o sentido','Volume menor, pressão maior (se T não muda).','Mesmo número de partículas num espaço menor bate mais nas paredes.']]);
D('Variação de entalpia',[
['Sempre produtos menos reagentes','ΔH = Hprodutos − Hreagentes, nessa ordem.','ΔH mede o que mudou: estado final menos o inicial.'],
['Cuidado com subtrair negativo','−300 − (−100) = −300 + 100 = <b>−200</b>.','Subtrair um número negativo equivale a somar. Muita gente erra o sinal aqui.'],
['Interprete o sinal','ΔH negativo: libera calor (exotérmica). ΔH positivo: absorve calor (endotérmica).','Se os produtos têm menos energia, a diferença saiu para o ambiente como calor.'],
['Respeite os coeficientes','Se a equação foi dobrada, o ΔH dobra. Se foi invertida, o ΔH troca de sinal.','O ΔH vale para a equação do jeito que está escrita, com as quantidades de mols dela.']]);
D('Meia-vida',[
['Ache quantas meias-vidas passaram','x = t ÷ P. Com t = 30 anos e P = 10 anos, x = 3.','A massa só cai pela metade a cada intervalo P, então o que importa é o número de intervalos.'],
['Divida por 2, x vezes','m = m₀ ÷ 2ˣ = 80 ÷ 2³ = 80 ÷ 8 = <b>10 g</b>.','Cada meia-vida corta a massa ao meio. Três cortes dividem por 8.'],
['Confira passo a passo','80 → 40 → 20 → 10: três metades.','Fazer a sequência na mão é um teste rápido de que o resultado está certo.'],
['Quanto decaiu?','80 − 10 = 70 g decaíram. Sobrou 1 ÷ 8 = 12,5%.','O Enem às vezes pergunta o que desapareceu, não o que restou. Leia o comando.']]);

const TA=(a,b,c,d,col)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="3.5" stroke-linecap="round" marker-end="url(#${col===RED?'ahr':'ahb'})"/>`;
const TX=(x,y,t,o='')=>`<text x="${x}" y="${y}" font-size="10" font-weight="700" ${/fill=/.test(o)?'':'fill="currentColor"'} ${o}>${t}</text>`;

 +[[20,'hsl(5 70% 55%)','1 alcalinos'],[130,'hsl(30 80% 50%)','2 alcalino-terrosos'],[20,'hsl(50 85% 48%)','16 calcogênios'],[130,'hsl(145 55% 42%)','17 halogênios'],[250,'hsl(265 55% 58%)','18 gases nobres']].map((c,i)=>{const y=i<2?172:188;return `<rect x="${c[0]}" y="${y-9}" width="10" height="10" rx="2" fill="${c[1]}"/>`+TX(c[0]+14,y,c[2])}).join('')
 +TX(139,104,'metais de transição','text-anchor="middle" fill-opacity=".8"'));

const SV3=TS(190,TB()+TA(8,150,8,22,BLU)+TA(24,166,320,166,BLU)+TX(14,90,'eletronegatividade cresce',`fill="${BLU}" transform="rotate(-90 14 90)" text-anchor="middle"`)+TX(172,184,'eletronegatividade cresce',`fill="${BLU}" text-anchor="middle"`)+`<circle cx="300.5" cy="44" r="8" fill="none" stroke="${BLU}" stroke-width="2.5"/>`+TX(254,30,'F: o maior',`fill="${BLU}"`));

{n:'Famílias e localização',s:'Grupos 1, 2, 16, 17, 18 e blocos s, p, d, f',h:165,b:[

{n:'Raio atômico',s:'Cresce para baixo e para a esquerda',h:150,b:[
